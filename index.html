  if(data.some(d=>d.reps>0))
    html+=`<div class="chart-box"><div class="chart-title">${escHtml(ex.name)} — Avg reps</div>${renderSVGChart(data,'reps','reps','#c8a96e')}</div>`;
  document.getElementById('page-charts').innerHTML=html;
}
function renderSVGChart(data,key,unit,color){
  const W=340,H=150,PL=36,PR=16,PT=10,PB=26,cW=W-PL-PR,cH=H-PT-PB;
  const vals=data.map(d=>d[key]);
  const minV=Math.min(...vals),maxV=Math.max(...vals),range=maxV-minV||1;
  const xs=data.map((_,i)=>PL+(i/(Math.max(data.length-1,1)))*cW);
  const ys=vals.map(v=>PT+cH-((v-minV)/range)*cH);
  const yL=[minV,minV+range/2,maxV].map(v=>Math.round(v*10)/10);
  let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" style="height:${H}px">`;
  [0,.5,1].forEach(t=>{const y=PT+cH-t*cH;
    svg+=`<line class="chart-grid" x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}"/>`;
    svg+=`<text class="chart-label" x="${PL-4}" y="${y+3}" text-anchor="end">${yL[t===0?0:t===.5?1:2]}</text>`;
  });
  const step=Math.max(1,Math.floor(data.length/5));
  data.forEach((d,i)=>{if(i%step===0||i===data.length-1)svg+=`<text class="chart-label" x="${xs[i]}" y="${H-4}" text-anchor="middle">${fmtShort(d.date)}</text>`;});
  if(data.length>1){
    svg+=`<polyline class="chart-line" points="${xs.map((x,i)=>`${x},${ys[i]}`).join(' ')}" stroke="${color}"/>`;
    svg+=`<polygon points="${[`${xs[0]},${PT+cH}`,...xs.map((x,i)=>`${x},${ys[i]}`),`${xs[xs.length-1]},${PT+cH}`].join(' ')}" fill="${color}" opacity=".08"/>`;
  }
  data.forEach((d,i)=>{
    const tip=`${fmtDate(d.date)}: ${d[key]}${unit}`;
    svg+=`<circle class="chart-dot" cx="${xs[i]}" cy="${ys[i]}" r="5" fill="${color}" onmouseenter="showTip(event,'${tip}')" onmouseleave="hideTip()" ontouchstart="showTip(event,'${tip}')"/>`;
  });
  return svg+'</svg>';
}
function selectChartEx(id){selectedChartEx=selectedChartEx===id?null:id;renderCharts();}

function calcMuscleData(exercises){
  const smT={};
  for(const ex of exercises){
    const key=(ex.name||'').toLowerCase().trim();
    const map=MUSCLE_EX[key];
    if(!map)continue;
    for(const[sid,w]of Object.entries(map))
      smT[sid]=(smT[sid]||0)+w;
  }
  const grpT={};
  for(const[sid,t]of Object.entries(smT)){
    const g=MUSCLE_SM[sid]?.grp;
    if(g)grpT[g]=(grpT[g]||0)+t;
  }
  return{smT,grpT};
}
function muscleArcPath(cx,cy,R,ri,s,e){
  if(e-s<0.1)return'';
  const toXY=(r,deg)=>{const a=(deg-90)*Math.PI/180;return[+(cx+r*Math.cos(a)).toFixed(2),+(cy+r*Math.sin(a)).toFixed(2)];};
  const lg=e-s>180?1:0;
  const[x1,y1]=toXY(R,s),[x2,y2]=toXY(R,e),[x3,y3]=toXY(ri,e),[x4,y4]=toXY(ri,s);
  return`M${x1},${y1} A${R},${R} 0 ${lg} 1 ${x2},${y2} L${x3},${y3} A${ri},${ri} 0 ${lg} 0 ${x4},${y4} Z`;
}
function renderMiniMuscleSVG(exercises,size){
  size=size||52;
  const{smT,grpT}=calcMuscleData(exercises);
  const grand=Object.values(grpT).reduce((a,b)=>a+b,0);
  if(!grand)return'';
  const cx=size/2,cy=size/2,oR=size/2-1,ori=size/2-9,iR=size/2-11,iri=size/2-19,gap=3;
  let paths='';let ang=0;
  for(const grp of MUSCLE_GO){
    const gt=grpT[grp]||0;if(!gt)continue;
    const gsw=(gt/grand)*360;
    const d=muscleArcPath(cx,cy,iR,iri,ang+gap/2,ang+gsw-gap/2);
    if(d)paths+=`<path d="${d}" fill="${MUSCLE_GC[grp]}"/>`;
    const grpSMs=Object.entries(smT).filter(([id])=>MUSCLE_SM[id]?.grp===grp);
    const smSum=grpSMs.reduce((s,[,v])=>s+v,0);
    let sa=ang;
    for(const[sid,sv]of grpSMs){
      const ssw=(sv/smSum)*gsw;
      const od=muscleArcPath(cx,cy,oR,ori,sa+gap/2,sa+ssw-gap/2);
      if(od)paths+=`<path d="${od}" fill="${MUSCLE_SM[sid].c}"/>`;
      sa+=ssw;
    }
    ang+=gsw;
  }
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${iri-2}" fill="var(--white)"/></svg>`;
}
function pickMuscleSeg(id,type){
  if(id===null||(muscleSel===id&&muscleSelType===type)){muscleSel=null;muscleSelType=null;}
  else{muscleSel=id;muscleSelType=type;}
  renderMuscleFull();
}
function buildMuscleSummary(exercises){
  const{grpT}=calcMuscleData(exercises);
  const grand=Object.values(grpT).reduce((a,b)=>a+b,0);
  if(!grand)return`<p style="font-size:12px;color:var(--muted);margin:0">Add exercises to see the muscle analysis.</p>`;
  return MUSCLE_GO.filter(g=>grpT[g]).map(g=>{
    const pct=Math.round(grpT[g]/grand*100);
    return`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
      <div style="width:8px;height:8px;border-radius:2px;background:${MUSCLE_GC[g]};flex-shrink:0"></div>
      <span style="font-size:11px;color:var(--muted);flex:1">${g}</span>
      <div style="width:54px;height:4px;background:var(--line);border-radius:2px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${MUSCLE_GC[g]}"></div></div>
      <span style="font-size:10px;font-weight:700;color:var(--ink);width:26px;text-align:right">${pct}%</span>
    </div>`;
  }).join('');
}
function setChartsTab(tab){chartsSubTab=tab;muscleSel=null;muscleSelType=null;renderCharts();}
function setMuscleMode(mode){muscleMode=mode;muscleSel=null;muscleSelType=null;renderCharts();}
function renderMuscleFull(){
  const container=document.getElementById('muscle-full-view');
  if(!container)return;
  let exercises;
  if(muscleMode==='global'){
    exercises=Object.values(workoutDefs).filter(s=>!s._deleted&&!s._archived).flatMap(s=>s.exercises||[]);
  }else{
    exercises=(workoutDefs[chartSession]?.exercises)||(workoutDefs[currentSession]?.exercises)||[];
  }
  const{smT,grpT}=calcMuscleData(exercises);
  const grand=Object.values(grpT).reduce((a,b)=>a+b,0);
  if(!grand){
    container.innerHTML=`<div class="empty"><div class="empty-icon">💪</div><div class="empty-title">No muscle data</div><div class="empty-sub">Add exercises to see the analysis</div></div>`;
    return;
  }
  const cx=82,cy=82,oR=78,ori=61,iR=54,iri=37,gap=2;
  let svgPaths='';let ang=0;
  for(const grp of MUSCLE_GO){
    const gt=grpT[grp]||0;if(!gt)continue;
    const gsw=(gt/grand)*360;
    const isGrp=muscleSel===grp&&muscleSelType==='group';
    const grpHasSel=muscleSelType==='sub'&&MUSCLE_SM[muscleSel]?.grp===grp;
    const iFade=muscleSel?(isGrp||grpHasSel?1:0.2):1;
    const d=muscleArcPath(cx,cy,iR,iri,ang+gap/2,ang+gsw-gap/2);
    if(d)svgPaths+=`<path d="${d}" fill="${MUSCLE_GC[grp]}" opacity="${iFade}" class="muscle-seg" onclick="pickMuscleSeg('${grp}','group')" ontouchstart="pickMuscleSeg('${grp}','group')"><title>${grp}</title></path>`;
    const grpSMs=Object.entries(smT).filter(([id])=>MUSCLE_SM[id]?.grp===grp);
    const smSum=grpSMs.reduce((s,[,v])=>s+v,0);
    let sa=ang;
    for(const[sid,sv]of grpSMs){
      const ssw=(sv/smSum)*gsw;
      const isSm=muscleSel===sid&&muscleSelType==='sub';
      const oFade=muscleSel?(isSm||isGrp?1:grpHasSel?0.6:0.2):1;
      const od=muscleArcPath(cx,cy,oR,ori,sa+gap/2,sa+ssw-gap/2);
      if(od)svgPaths+=`<path d="${od}" fill="${MUSCLE_SM[sid].c}" opacity="${oFade}" class="muscle-seg" onclick="pickMuscleSeg('${sid}','sub')" ontouchstart="pickMuscleSeg('${sid}','sub')"><title>${MUSCLE_SM[sid].lab}</title></path>`;
      sa+=ssw;
    }
    ang+=gsw;
  }
  let ct='',cb='';
  if(!muscleSel){
    ct=muscleMode==='global'?'Global':((workoutDefs[chartSession]||workoutDefs[currentSession])?.label?.split(' ').slice(0,2).join(' ')||'');
    cb=`${exercises.length} exercises`;
  }else if(muscleSelType==='group'){
    ct=muscleSel;cb=`${Math.round((grpT[muscleSel]||0)/grand*100)}%`;
  }else{
    const sm=MUSCLE_SM[muscleSel];
    ct=sm?.lab?.split(' ').slice(0,2).join(' ')||muscleSel;
    cb=`${Math.round((smT[muscleSel]||0)/grand*100)}%`;
  }
  const svgHtml=`<svg width="164" height="164" viewBox="0 0 164 164" style="flex-shrink:0">${svgPaths}
    <circle cx="${cx}" cy="${cy}" r="${iri-2}" fill="var(--white)" style="cursor:pointer" onclick="pickMuscleSeg(null,null)" ontouchstart="pickMuscleSeg(null,null)"/>
    <text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="9" font-family="DM Sans,sans-serif" fill="var(--muted)">${escHtml(ct)}</text>
    <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="13" font-weight="700" font-family="DM Sans,sans-serif" fill="var(--ink)">${escHtml(cb)}</text>
  </svg>`;
  let panelHtml='';
  if(!muscleSel){
    panelHtml=MUSCLE_GO.filter(g=>grpT[g]).map(g=>{
      const pct=Math.round(grpT[g]/grand*100);
      const subs=Object.entries(smT).filter(([id])=>MUSCLE_SM[id]?.grp===g);
      return`<div class="muscle-legend-row" onclick="pickMuscleSeg('${g}','group')">
        <div style="width:8px;height:8px;border-radius:2px;background:${MUSCLE_GC[g]};flex-shrink:0"></div>
        <span style="font-size:11px;color:var(--muted);flex:1">${g}</span>
        <span style="font-size:11px;font-weight:700;color:var(--ink)">${pct}%</span>
      </div><div style="display:flex;gap:2px;flex-wrap:wrap;margin-bottom:2px">${
        subs.map(([id])=>`<div title="${MUSCLE_SM[id].lab}" style="width:7px;height:7px;border-radius:1px;background:${MUSCLE_SM[id].c}"></div>`).join('')
      }</div>`;
    }).join('');
  }else if(muscleSelType==='group'){
    const subs=Object.entries(smT).filter(([id])=>MUSCLE_SM[id]?.grp===muscleSel).sort((a,b)=>b[1]-a[1]);
    const gSum=subs.reduce((s,[,v])=>s+v,0);
    panelHtml=`<div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">${muscleSel}</div>`;
    panelHtml+=subs.map(([id,v])=>{
      const pct=Math.round(v/gSum*100);
      return`<div class="muscle-legend-row" onclick="pickMuscleSeg('${id}','sub')">
        <div style="width:7px;height:7px;border-radius:2px;background:${MUSCLE_SM[id].c};flex-shrink:0"></div>
        <span style="font-size:10px;color:var(--muted);flex:1">${MUSCLE_SM[id].lab}</span>
        <span style="font-size:11px;font-weight:700;color:var(--ink)">${pct}%</span>
      </div>`;
    }).join('');
  }else{
    const sm=MUSCLE_SM[muscleSel];
    const pct=Math.round((smT[muscleSel]||0)/grand*100);
    panelHtml=`<div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">${sm?.grp||''}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <div style="width:10px;height:10px;border-radius:2px;background:${sm?.c||'#888'}"></div>
        <span style="font-size:12px;font-weight:600;color:var(--ink)">${sm?.lab||muscleSel}</span>
      </div>
      <div style="font-size:28px;font-weight:800;color:var(--ink);line-height:1">${pct}%</div>
      <div style="font-size:9px;color:var(--muted);margin-top:2px">of total</div>`;
  }
  let filtExs=exercises;
  if(muscleSel){
    if(muscleSelType==='group')
      filtExs=exercises.filter(ex=>{const map=MUSCLE_EX[(ex.name||'').toLowerCase().trim()]||{};return Object.keys(map).some(sid=>MUSCLE_SM[sid]?.grp===muscleSel);});
    else
      filtExs=exercises.filter(ex=>!!(MUSCLE_EX[(ex.name||'').toLowerCase().trim()]||{})[muscleSel]);
  }
  const seen=new Set();
  filtExs=filtExs.filter(ex=>{const k=ex.name;if(seen.has(k))return false;seen.add(k);return true;});
  const listTitle=muscleSel
    ?(muscleSelType==='group'?`Exercises — ${muscleSel}`:`Exercises — ${MUSCLE_SM[muscleSel]?.lab||muscleSel}`)
    :`All exercises (${filtExs.length})`;
  const exListHtml=filtExs.length
    ?`<div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">${escHtml(listTitle)}</div>`+
      filtExs.map(ex=>{
        const topSM=Object.entries(MUSCLE_EX[(ex.name||'').toLowerCase().trim()]||{}).sort((a,b)=>b[1]-a[1]).slice(0,4);
        return`<div class="muscle-exrow">
          <span style="font-size:12px;color:var(--ink);flex:1">${escHtml(ex.name)}</span>
          <div style="display:flex;gap:3px">${topSM.map(([id])=>`<div title="${MUSCLE_SM[id]?.lab||id}" style="width:7px;height:7px;border-radius:50%;background:${MUSCLE_SM[id]?.c||'#888'}"></div>`).join('')}</div>
        </div>`;

  container.innerHTML=`

      ${svgHtml}
      <div style="flex:1;min-width:0;padding-top:4px;max-height:170px;overflow-y:auto">${panelHtml}</div>
    </div>
    <div style="background:var(--bg);border-radius:10px;padding:12px 14px">${exListHtml}</div>`;
}

const CATEGORY_ALTS={
  11:['Incline dumbbell press','Pec deck flyes','Cable crossover','Weighted push-ups','Hammer Strength press'],
  12:['Machine row','Cable pullover','Face pull','Dumbbell row','Neutral grip pull-ups'],
  13:['Arnold press','Face pull','Front raises','Cable upright row','Reverse flyes'],
  8: ['Preacher curl','Machine curl','EZ bar French press','Tricep kickbacks','Cable rope triceps'],
  9: ['Leg press','Hack squat','Dumbbell step-up','Quad extension','Lying leg curl'],
  10:['Plank','Russian twist','Machine crunch','Hanging leg raise','Ab wheel'],
};
function guessExCat(name){
  const n=(name||'').toLowerCase();
  if(/pecho|banca|inclinado|push.?up|fly|apertura|crossover|press.*pech|chest/.test(n))return 11;
  if(/espalda|remo|lat\b|pulldown|dominada|jal[oó]n|pull.*up|back|row/.test(n))return 12;
  if(/hombro|militar|shoulder|elevaci|arnold|face.?pull|deltoid|upright/.test(n))return 13;
  if(/curl|b[ií]cep|tríc|tric|martillo|hammer|predicador|fondo|dip/.test(n))return 8;
  if(/pierna|leg|squat|sentadil|lunge|prensa|muerto|deadlift|hip.?thrust|glute|femoral|b[úu]lgar/.test(n))return 9;
  if(/core|abs|plancha|plank|crunch|abdomen|russian|rueda|ab.?wheel/.test(n))return 10;
  return null;
}
function getAlternatives(exName,count=2){
  const catId=guessExCat(exName);
  const pool=catId&&CATEGORY_ALTS[catId]?CATEGORY_ALTS[catId]:['Machine equivalent exercise','Dumbbell version'];
  const nl=exName.toLowerCase();
  const filtered=pool.filter(a=>!nl.includes(a.toLowerCase().split(' ')[0].replace(/[^\w]/g,'')));
  return filtered.slice(0,count).length>=count?filtered.slice(0,count):pool.slice(0,count);
}
function toggleAlts(exId){
  const box=document.getElementById('alts-'+exId);
  if(box)box.classList.toggle('open');
}

function exToCatId(ex){
  for(const m of(ex.primaryMuscles||[])){
    const id=MUSCLE_TO_CAT[m.toLowerCase()];
    if(id)return id;
  }
  return null;
}

// Returns a Promise<boolean>; concurrent calls share the same fetch
function ensureFreeExDb(){
  if(_freeExAll?.length)return Promise.resolve(true);
  if(_freeExPromise)return _freeExPromise;
  _freeExPromise=(async()=>{
    // 1. Try localStorage cache (full DB, 7-day TTL)
    try{
      const c=localStorage.getItem(FREE_EX_CACHE_KEY);
      if(c){const{data,ts}=JSON.parse(c);if(Date.now()-ts<FREE_EX_TTL){_freeExAll=data;return true;}}
    }catch(e){}
    // 2. Fetch from GitHub CDN
    try{
      const resp=await fetch(FREE_EX_URL);
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      _freeExAll=await resp.json();
      // Try to cache full DB; silently ignore if device storage is full
      try{localStorage.setItem(FREE_EX_CACHE_KEY,JSON.stringify({data:_freeExAll,ts:Date.now()}));}
      catch(e){/* too large — stays in memory only */}
      return true;
    }catch(e){
      console.error('Free exercise DB:',e);
      _freeExAll=[];
      return false;
    }
  })();
  return _freeExPromise;
}

function getFreeExForCat(catId){
  return(_freeExAll||[]).filter(ex=>exToCatId(ex)===catId);
}

// Convert a free-exercise-db entry → our libData entry format
function freeExToLibEntry(ex){
  const imgs=(ex.images||[]).map(p=>FREE_EX_IMG+p);
  return{
    id:ex.id,
    name:ex.name,
    description:(ex.instructions||[]).join(' '),
    images:imgs.length?[{image:imgs[0]}]:[],
    allImages:imgs,
    level:ex.level,
    equipment:ex.equipment,
    category:ex.category,
    primaryMuscles:ex.primaryMuscles||[],
    secondaryMuscles:ex.secondaryMuscles||[],
    instructions:ex.instructions||[],
  };
}

async function selectLibCat(catId){
  libCat=catId;
  if(!libData[catId]&&!libLoading[catId]) await fetchLibCat(catId);
  else renderLibrary();
}

async function fetchLibCat(catId){
  // 1. Check per-category localStorage cache (7 days)
  try{
    const c=localStorage.getItem(LIB_CACHE_PRE+catId);
    if(c){const{data,ts}=JSON.parse(c);if(Date.now()-ts<FREE_EX_TTL&&data?.length){libData[catId]=data;renderLibrary();if(pickerVisible)renderPickerList();return;}}
  }catch(e){}

  libLoading[catId]=true; renderLibrary();

  // 2. Load the full exercise database (one shared fetch, cached)
  await ensureFreeExDb();

  // 3. Filter and convert
  libData[catId]=getFreeExForCat(catId).map(freeExToLibEntry);

  // 4. Cache per-category (smaller subset → fits comfortably in localStorage)
  try{localStorage.setItem(LIB_CACHE_PRE+catId,JSON.stringify({data:libData[catId],ts:Date.now()}));}catch(e){}

  libLoading[catId]=false;
  renderLibrary();
  if(pickerVisible)renderPickerList();
}

// Force-refresh a category (clears cache first)
function forceFetchLibCat(catId){
  localStorage.removeItem(LIB_CACHE_PRE+catId);
  delete libData[catId];
  fetchLibCat(catId);
}

function renderPickerList(){
  const listEl=document.getElementById('picker-list');
  if(!listEl)return;
  const q=(document.getElementById('picker-search')?.value||'').toLowerCase().trim();

  const anyLoading=MUSCLE_CATS.some(mc=>libLoading[mc.id]);
  const hasAny=MUSCLE_CATS.some(mc=>libData[mc.id]?.length);
  const bar=document.getElementById('picker-bar');
  if(bar)bar.style.display=anyLoading?'block':'none';

  if(!hasAny&&anyLoading){
    listEl.innerHTML='<div class="picker-status">⏳ Loading exercises…</div>';
    return;
  }

  const catsToShow=pickerCat?MUSCLE_CATS.filter(mc=>mc.id===pickerCat):MUSCLE_CATS;
  let html='';

  catsToShow.forEach(mc=>{
    if(!libData[mc.id]?.length)return;
    const pool=q?libData[mc.id].filter(e=>e.name.toLowerCase().includes(q)):libData[mc.id];
    if(!pool.length)return;

    // Show category header only in "all" mode or when searching across cats
    if(!pickerCat||q){
      html+=`<div class="picker-cat-hdr" style="color:${mc.color}">${mc.emoji} ${mc.name}</div>`;
    }

    const limit=pickerCat&&!q?pool.length:(q?15:5);
    pool.slice(0,limit).forEach(ex=>{
      // KEY FIX: use data-exname attribute, not onclick JSON — avoids quote-breaking bugs
      html+=`<div class="picker-ex-item" data-exname="${escHtml(ex.name)}" onclick="pickExFromEl(this)">
        <span class="picker-ex-name">${escHtml(ex.name)}</span>
        <span class="picker-add-icon">＋</span>
      </div>`;
    });

    if(!pickerCat&&!q&&pool.length>5){
      html+=`<button class="picker-see-all" data-cat="${mc.id}" onclick="setPickerCat(${mc.id})">
        See all exercises for ${mc.name} (${pool.length}) →
      </button>`;
    }
  });

  listEl.innerHTML=html||'<div class="picker-status">No results — use a custom name ↓</div>';
}

function renderData(){
  const total=Object.keys(allLogs).length;
  const sizeKb=(JSON.stringify(allLogs).length/1024).toFixed(1);
  // Dynamic per-session counts
  const sessBreakdown=Object.keys(workoutDefs).map(k=>{
    const count=Object.values(allLogs).filter(l=>l.session===k).length;
    const label=workoutDefs[k]?.label||k;
    const color=workoutDefs[k]?.color||'var(--muted)';
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px">
      <span style="font-weight:600;color:${color}">${escHtml(label)}</span>
      <span style="color:var(--muted);font-family:'DM Mono',monospace">${count} workout${count!==1?'s':''}</span>
    </div>`;
  }).join('');

function exportData(){
  const blob=new Blob([JSON.stringify(allLogs,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`gymtracker_backup_${today()}.json`;a.click();
  URL.revokeObjectURL(url);
}
function importFromText(){
  const text=document.getElementById('import-text').value.trim();
  const msg=document.getElementById('import-msg');
  if(!text){showMsg(msg,'Paste JSON content before importing','err');return;}
  try{
    const parsed=JSON.parse(text);const count=Object.keys(parsed).length;
    if(!count){showMsg(msg,'Empty JSON or incorrect format','err');return;}
    allLogs={...allLogs,...parsed};saveAll();updateStats();
    if(currentUser&&fbDb){
      const batch=fbDb.batch();
      Object.keys(parsed).forEach(k=>batch.set(sessionsRef().doc(k),parsed[k]));
      batch.commit().catch(console.error);
    }
    document.getElementById('import-text').value='';
    showMsg(msg,`✓ ${count} sessions imported`,'ok');renderData();
  }catch(e){showMsg(msg,'Invalid JSON','err');}
}
function importFromFile(){
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
  input.onchange=e=>{const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();reader.onload=ev=>{document.getElementById('import-text').value=ev.target.result;};
    reader.readAsText(file);};
  input.click();
}
function clearAllData(){
  if(!confirm('Delete ALL data? This cannot be undone.'))return;
  allLogs={};saveAll();clearDraft();updateStats();renderData();
}
function showMsg(el,text,type){
  el.textContent=text;el.className=`msg ${type}`;el.style.display='block';
  setTimeout(()=>{el.style.display='none';},4000);
}

// ─────────────────────────────────────────────────────────────────
// FIREBASE AUTH + SYNC
// ─────────────────────────────────────────────────────────────────
function sessionsRef(){return fbDb.collection('users').doc(currentUser.uid).collection('sessions');}

function initFirebase(){
  try{
    firebase.initializeApp(FB_CONFIG);
    fbDb=firebase.firestore();fbAuth=firebase.auth();

    // Handle returning from signInWithRedirect (fallback path)
    fbAuth.getRedirectResult().then(result=>{
      if(result&&result.user)console.log('Redirect sign-in OK:',result.user.email);
    }).catch(e=>{
      if(e.code&&e.code!=='auth/no-auth-event'){
        console.error('Redirect error:',e);
        setCloudStatus('error');
        showToast('⚠️ Authentication error: '+e.code);
      }
    });

    fbAuth.onAuthStateChanged(async user=>{
      currentUser=user;
      if(user){await syncFromCloud();}
      else{setCloudStatus('not-signed-in');if(currentView==='data')renderData();}
    });

    // ── Fallback for Chrome iOS PWA ──────────────────────────────────────
    // Firebase notifies via BroadcastChannel when another tab signs in.
    // If BroadcastChannel works (storage shared), onAuthStateChanged fires
    // automatically. The visibilitychange check is a manual fallback for
    // cases where storage is isolated between PWA and browser tabs.
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='visible'&&!currentUser&&fbAuth){
        const user=fbAuth.currentUser;
        if(user){
          currentUser=user;
          setCloudStatus('syncing');
          syncFromCloud().then(()=>render());
          showToast('✓ Session detected: '+user.email);
        }
      }
    });

  }catch(e){console.warn('Firebase init error:',e);}
}

async function syncFromCloud(){
  if(!currentUser||!fbDb)return;
  setCloudStatus('syncing');
  try{
    // Sync sessions
    const snap=await sessionsRef().get();
    const cloudLogs={};snap.forEach(doc=>{cloudLogs[doc.id]=doc.data();});
    const localOnlyKeys=Object.keys(allLogs).filter(k=>!cloudLogs[k]);
    if(localOnlyKeys.length>0){
      const batch=fbDb.batch();
      localOnlyKeys.forEach(k=>batch.set(sessionsRef().doc(k),allLogs[k]));
      await batch.commit();
    }
    allLogs={...allLogs,...cloudLogs};saveAll();

    // Sync workout defs
    try{
      const wSnap=await fbDb.collection('users').doc(currentUser.uid).collection('config').doc('workouts').get();
      if(wSnap.exists){
        const cloudDefs=wSnap.data();
        // Merge: cloud wins
        workoutDefs={...workoutDefs,...cloudDefs};
        localStorage.setItem(WORKOUT_KEY,JSON.stringify(workoutDefs));
      }
    }catch(e){}

    updateStats();render();
    lastSyncTime=new Date();setCloudStatus('synced');

  }catch(e){console.error('Sync error:',e);setCloudStatus('error');}
}

async function saveToCloud(key){
  if(!currentUser||!fbDb)return;
  try{await sessionsRef().doc(key).set(allLogs[key]);lastSyncTime=new Date();setCloudStatus('synced');}
  catch(e){console.error('Cloud save error:',e);setCloudStatus('error');}
}
async function deleteFromCloud(key){
  if(!currentUser||!fbDb)return;
  try{await sessionsRef().doc(key).delete();}catch(e){console.error('Cloud delete:',e);}
}
function _isStandalone(){
  return window.navigator.standalone===true||
    window.matchMedia('(display-mode: standalone)').matches;
}
async function signInWithGoogle(){
  if(!fbAuth)return;
  const provider=new firebase.auth.GoogleAuthProvider();
  // ── signInWithPopup for ALL contexts ─────────────────────────────────────
  // Why this works even in Chrome iOS PWA:
  //   window.open(sameOriginPwaUrl) → Chrome intercepts → redirects to PWA → tab closes instantly ✗
  //   signInWithPopup internally opens firebaseapp.com/__/auth/handler (DIFFERENT domain)
  //   → Chrome does NOT intercept → popup stays open → user signs in → postMessage back → done ✓
  //
  // If popup is genuinely blocked (auth/popup-blocked error), fall back to redirect.
  try{
    await fbAuth.signInWithPopup(provider);
  }catch(e){
    if(e.code==='auth/popup-blocked'){
      showToast('Popup blocked — redirecting to Google…');
      setTimeout(()=>fbAuth.signInWithRedirect(provider),400);
    } else if(!['auth/cancelled-popup-request','auth/popup-closed-by-user','auth/user-cancelled'].includes(e.code)){
      showToast('⚠️ '+(e.message||'Sign-in error'));
    }
  }
}
// Fallback for edge cases: manually re-check Firebase auth state.
async function recheckAuth(){
  if(!fbAuth||currentUser)return;
  const user=fbAuth.currentUser;
  if(user){
    currentUser=user;
    setCloudStatus('syncing');
    await syncFromCloud();
    render();
    showToast('✓ Signed in: '+user.email);
  } else {
    showToast('No session detected — please try again');
  }
}
async function signOutUser(){
  if(!fbAuth)return;
  if(!confirm('Sign out? Local data is preserved.'))return;
  await fbAuth.signOut();
}
function handleSyncChip(){
  if(cloudStatus==='not-signed-in'||cloudStatus==='error')signInWithGoogle();
  else if(cloudStatus==='synced')signOutUser();
}
function setCloudStatus(status){
  cloudStatus=status;
  const chip=document.getElementById('sync-chip');if(!chip)return;
  const label={'not-signed-in':'☁️ Sign in','syncing':'🔄 Syncing…',
    'synced':`✓ ${currentUser?.email?.split('@')[0]??'Synced'}`,'error':'⚠️ Retry'};
  const cls={'not-signed-in':'','syncing':'syncing','synced':'signed-in','error':'error'};
  chip.textContent=label[status]??'';
  chip.className='sync-chip'+(cls[status]?' '+cls[status]:'');
  if(currentView==='data')renderData();
}

function renderSesiones(){

  keys.forEach(key=>{

    const {label,sub,color,exercises=[]}=sess;
    const logs=Object.values(allLogs).filter(l=>l.session===key).sort((a,b)=>b.date.localeCompare(a.date));

        <div class="sess-card-meta">
          <span class="sess-card-pill">${exercises.length} exercises</span>
          <span class="sess-card-pill">${lastStr}</span>
          ${logs.length?`<span class="sess-card-pill">${logs.length} session${logs.length>1?'s':''}</span>`:''}
        </div>
        <div class="sess-card-actions">
          <button class="sess-btn-train" style="background:${color}" onclick="startSession('${key}')">▶ Train</button>
          <button class="sess-btn-edit" onclick="editSession('${key}')">✏️ Edit</button>

}

function renderHome(){
  // ── Daily metrics (manual entry) ─────────────────────────────
  const dm=getDailyMetrics(today());
  const rClr=recoveryColor(dm.recovery);
  const sClr=dm.strain==null?'var(--muted)':dm.strain>=18?'#E84040':dm.strain>=14?'#F5A623':dm.strain>=9?'#F5C842':'#3CE0A0';

  // ── Greeting ──────────────────────────────────────────────────
  const now=new Date();
  const hr=now.getHours();
  const greetWord=hr<12?'morning':hr<18?'afternoon':'evening';
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateLabel=`${days[now.getDay()]}, ${months[now.getMonth()].toUpperCase()} ${now.getDate()}`;
  const greeting=`
    <div style="margin-bottom:20px">
      <div style="font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">${dateLabel}</div>
      <div style="font-family:'DM Sans',sans-serif;font-size:40px;font-weight:800;color:var(--ink);line-height:1.05">Good ${greetWord}.</div>
    </div>`;

  // ── Daily metrics tiles (tap to edit) ────────────────────────
  const statTiles=`
    <div class="home-stat-tiles">
      <div class="home-stat-tile" onclick="editDailyMetric('recovery')" style="cursor:pointer">
        <div class="hst-val" style="color:${dm.recovery!=null?rClr:'var(--muted)'}">${dm.recovery!=null?dm.recovery:'—'}</div>
        <div class="hst-lbl">Recovery</div>
      </div>
      <div class="home-stat-tile" onclick="editDailyMetric('sleep')" style="cursor:pointer">
        <div class="hst-val">${dm.sleep||'—'}</div>
        <div class="hst-lbl">Sleep</div>
      </div>
      <div class="home-stat-tile" onclick="editDailyMetric('strain')" style="cursor:pointer">
        <div class="hst-val" style="color:${dm.strain!=null?sClr:'var(--muted)'}">${dm.strain!=null?dm.strain.toFixed(1):'—'}</div>
        <div class="hst-lbl">Strain</div>
      </div>
    </div>`;

  // ── Session cards (all non-archived) ─────────────────────────
  const restSec=getRestGoal().rest;
  // Mirror Sessions tab filter exactly: skip _deleted and _archived
  const nonArchivedSessions=Object.entries(workoutDefs).filter(([,s])=>!s._deleted&&!s._archived);
  const sessCards=nonArchivedSessions.map(([key,sess])=>{
    const logs=Object.values(allLogs).filter(l=>l.session===key).sort((a,b)=>b.date.localeCompare(a.date));
    const lastLog=logs[0];
    const daysAgo=lastLog?Math.round((Date.now()-new Date(lastLog.date+'T12:00').getTime())/86400000):null;
    const lastLabel=daysAgo===0?'Today':daysAgo===1?'Yesterday':daysAgo!=null?daysAgo+'d ago':'Never';
    // Average strain from per-session manualStrain
    const strainLogs=logs.filter(l=>l.manualStrain!=null);
    const avgStrain=strainLogs.length?(strainLogs.reduce((t,l)=>t+l.manualStrain,0)/strainLogs.length):null;
    // Average session duration from timed logs
    const timedLogs=logs.filter(l=>l.startTime&&l.endTime);
    const avgMin=timedLogs.length?Math.round(timedLogs.reduce((t,l)=>t+(new Date(l.endTime)-new Date(l.startTime))/60000,0)/timedLogs.length):null;
    // Fallback estimate
    const exCount=(sess.exercises||[]).length;
    const estMin=!avgMin&&exCount>0?Math.round(exCount*3*(35+restSec)/60):null;
    const timeLabel=avgMin?`~${avgMin} min`:estMin?`~${estMin} min est.`:null;
    const strainColor=avgStrain!=null?(avgStrain>=18?'#E84040':avgStrain>=14?'#F5A623':avgStrain>=9?'#F5C842':'#3CE0A0'):'var(--muted)';
    return`<div class="home-sess-card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="min-width:0;flex:1">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
            <span style="font-size:10px;font-weight:800;color:#fff;background:var(--accent);padding:2px 7px;border-radius:4px;flex-shrink:0">${key}</span>
            <span style="font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(sess.label)}</span>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${escHtml(sess.sub)}</div>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <div style="font-size:10px;color:var(--muted)">Last: <b style="color:var(--ink)">${lastLabel}</b></div>
            <div style="font-size:10px;color:var(--muted)">Avg strain: <b style="font-family:'DM Mono',monospace;color:${strainColor}">${avgStrain!=null?avgStrain.toFixed(1):'—'}</b></div>
            ${timeLabel?`<div style="font-size:10px;color:var(--muted)">Avg time: <b style="color:var(--ink)">${timeLabel}</b></div>`:''}
          </div>
        </div>
        <button onclick="startSession('${key}')" style="background:var(--accent);border:none;border-radius:12px;width:46px;height:46px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');

  const sessSection=nonArchivedSessions.length
    ?`<div style="margin-bottom:16px">${sessCards}</div>`
    :`<div class="home-sess-card"><div style="color:var(--muted);font-size:13px;text-align:center;padding:8px 0">No sessions yet — create one in Sessions</div></div>`;

  // ── GitHub activity heatmap ───────────────────────────────────
  const heatmap=renderHeatmap();

  document.getElementById('page-home').innerHTML=greeting+statTiles+sessSection+heatmap;

  setTimeout(()=>{
    const el=document.getElementById('hm-scroll');
    if(el) el.scrollLeft=el.scrollWidth;
  },50);
}

  localStorage.setItem('home_weight', n.toFixed(1));

  try{localStorage.setItem('dailymetrics_'+date,JSON.stringify({...cur,...patch}));}catch(e){}
}
function editDailyMetric(field, date){
  date=date||today();
  const dm=getDailyMetrics(date);
  const prompts={recovery:'Recovery score (0–100):',sleep:'Sleep (e.g. 7h30):',strain:'Strain (0–21):'};
  const cur=dm[field]!=null?String(dm[field]):'';
  const val=prompt(prompts[field],cur);
  if(val===null)return;
  if(field==='recovery'){
    const n=parseInt(val);
    saveDailyMetrics(date,{recovery:val===''||isNaN(n)?null:Math.min(100,Math.max(0,n))});
  }else if(field==='strain'){
    const n=parseFloat(val);
    saveDailyMetrics(date,{strain:val===''||isNaN(n)?null:Math.min(21,Math.max(0,n))});
  }else{
    saveDailyMetrics(date,{sleep:val.trim()||null});
  }
  if(date===today())renderHome();
  renderHistory();
}
function editDailyMetricInline(field,date,val){
  const n=parseFloat(val);
  if(field==='strain') saveDailyMetrics(date,{strain:val===''||isNaN(n)?null:Math.min(21,Math.max(0,n))});
  if(field==='recovery') saveDailyMetrics(date,{recovery:val===''||isNaN(n)?null:Math.min(100,Math.max(0,n))});
  if(date===today())renderHome();
}
function renderHistDailyMetrics(date, sessKey){
  const dm=getDailyMetrics(date);
  const logEntry=sessKey?allLogs[`${sessKey}_${date}`]:null;
  const rcVal=dm.recovery!=null
    ?`<span style="font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:${recoveryColor(dm.recovery)}">${dm.recovery}</span><span style="font-size:10px;color:var(--muted);margin-left:2px">/100</span>`
    :`<span style="color:var(--muted);font-size:13px">—</span>`;
  const slVal=dm.sleep
    ?`<span style="font-family:'DM Mono',monospace;font-size:13px">${dm.sleep}</span>`
    :`<span style="color:var(--muted);font-size:13px">—</span>`;
  return`<div class="hist-strain-row">
    <span class="hist-time-label" style="cursor:pointer" onclick="editDailyMetric('recovery','${date}')">RECOVERY</span>
    <span style="cursor:pointer;display:inline-flex;align-items:center;gap:2px" onclick="editDailyMetric('recovery','${date}')">${rcVal}</span>
    <span style="flex:1"></span>
    <span class="hist-time-label" style="cursor:pointer;margin-left:8px" onclick="editDailyMetric('sleep','${date}')">SLEEP</span>
    <span style="cursor:pointer;margin-left:4px" onclick="editDailyMetric('sleep','${date}')">${slVal}</span>
  </div>
  <div class="hist-strain-row">
    <span class="hist-time-label">STRAIN</span>
    <input type="number" min="0" max="21" step="0.1" class="hist-time-input" style="width:60px;text-align:center"
      value="${logEntry?.manualStrain??''}" placeholder="0–21"
      onchange="editLogStrain('${sessKey??''}','${date}',this.value)">
    <span style="font-size:10px;color:var(--muted);margin-left:2px">/ 21</span>
  </div>`;
}
function recoveryColor(s){
  if(s==null)return'var(--muted)';
  return s>=67?'#3CE0A0':s>=34?'#F5C842':'#E84040';
}
function fmtStrain(s){return s!=null?s.toFixed(1):'—';}

setTimeout(async()=>{
  const ok=await ensureFreeExDb();
  if(!ok)return;
  for(const mc of MUSCLE_CATS){
    if(libData[mc.id])continue;
    try{
      const c=localStorage.getItem(LIB_CACHE_PRE+mc.id);
      if(c){const{data,ts}=JSON.parse(c);if(Date.now()-ts<FREE_EX_TTL&&data?.length){libData[mc.id]=data;continue;}}
    }catch(e){}
    libData[mc.id]=getFreeExForCat(mc.id).map(freeExToLibEntry);
    try{localStorage.setItem(LIB_CACHE_PRE+mc.id,JSON.stringify({data:libData[mc.id],ts:Date.now()}));}catch(e){}
  }
