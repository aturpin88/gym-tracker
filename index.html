<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ultimate Fitness Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ultimate Tracker">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#E8E8E8;--ink2:#AAAAAA;--muted:#505055;--line:#1E1E1E;
  --bg:#0A0A0A;--white:#141414;--gold:#E8A030;--danger:#FF5555;
  --green:#2ECC9A;--pr:#E8A030;--accent:#E85010;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}

/* ── INSTALL BANNER ── */
.install-banner{background:#0D1824;color:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.4;}
.ib-icon{font-size:20px;flex-shrink:0;}.ib-text{flex:1;}
.ib-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;flex-shrink:0;padding:0 4px;}

/* ── HEADER ── */
.header{background:#06060C;padding:18px 20px 0;position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,.5);border-bottom:1px solid var(--line);}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.logo{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.logo em{color:var(--accent);font-style:normal;}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.header-stats{display:flex;gap:20px;}
.hstat .hv{font-family:'DM Mono',monospace;font-size:22px;color:var(--gold);line-height:1;font-weight:600;}
.hstat .hk{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.sync-chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:3px 10px;font-size:10px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.3px;transition:all .2s;white-space:nowrap;}
.sync-chip:hover{background:rgba(255,255,255,.12);}
.sync-chip.signed-in{color:#86efac;border-color:rgba(134,239,172,.35);background:rgba(134,239,172,.08);}
.sync-chip.syncing{color:#93c5fd;border-color:rgba(147,197,253,.35);background:rgba(147,197,253,.08);}
.sync-chip.error{color:#fca5a5;border-color:rgba(252,165,165,.35);background:rgba(252,165,165,.08);}
.session-tabs{display:flex;gap:0;margin-top:4px;}
.stab{background:none;border:none;cursor:pointer;padding:11px 18px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:rgba(232,232,240,.35);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.stab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}
.stab:hover:not(.active){color:rgba(232,232,240,.65);}

/* ── VIEW TABS (hidden — bottom nav replaces) ── */
.view-tabs{display:none;}
/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#06060C;border-top:1px solid var(--line);display:flex;align-items:stretch;z-index:249;padding-bottom:env(safe-area-inset-bottom);}
.bnav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px 8px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:color .15s;-webkit-tap-highlight-color:transparent;min-height:52px;position:relative;}
.bnav-btn svg{width:21px;height:21px;flex-shrink:0;}
.bnav-btn span{line-height:1;}
.bnav-btn.active{color:var(--accent);}
.bnav-btn.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:2px;border-radius:0 0 2px 2px;background:var(--accent);}
/* ── CONTENT ── */
.content{padding:16px 16px 140px;}
.page{display:none;}.page.active{display:block;}

/* ── SESSION BANNER ── */
.session-banner{border-radius:14px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;color:#fff;}
.sb-title{font-size:17px;font-weight:800;}.sb-sub{font-size:11px;opacity:.55;margin-top:3px;}
.sb-badge{background:rgba(255,255,255,.12);border-radius:4px;padding:4px 10px;font-size:11px;opacity:.8;}
.sb-right{display:flex;align-items:center;gap:8px;}
.edit-plan-btn{background:rgba(255,255,255,.15);border:none;border-radius:5px;padding:5px 10px;font-size:10px;font-weight:700;color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.5px;}

/* ── VOLUME BAR ── */
.session-volume{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.sv-label{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:700;}
.sv-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:800;color:var(--gold);}

/* ── DATE ROW ── */
.date-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.date-row label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.date-input{border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:13px;background:var(--white);color:var(--ink);font-family:'DM Mono',monospace;}
.saved-badge{font-size:11px;color:var(--green);font-weight:700;background:rgba(46,204,154,.1);border:1px solid rgba(46,204,154,.3);padding:3px 8px;border-radius:3px;}
.draft-badge{font-size:11px;color:var(--gold);font-weight:700;background:rgba(232,160,48,.1);border:1px solid rgba(232,160,48,.3);padding:3px 8px;border-radius:3px;display:none;}

/* ── EXERCISE CARDS ── */
.ex-card{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;transition:border-color .2s;}
.ex-card.has-data{border-left-color:var(--sess-color);}
.ex-head{padding:11px 14px 8px;display:flex;justify-content:space-between;align-items:flex-start;}
.ex-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ex-name{font-size:13px;font-weight:600;color:var(--ink);}
.pr-badge{background:var(--gold);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;letter-spacing:.5px;display:none;}
.pr-badge.show{display:inline-block;}
.ex-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}
.ex-target{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;}
.ex-ref{font-size:11px;color:var(--muted);}
/* Compare last time */
.last-time{font-size:10px;color:var(--muted);padding:0 14px 6px;font-family:'DM Mono',monospace;border-bottom:1px dashed var(--line);}
.last-time span{color:var(--ink2);font-weight:500;}
/* Col headers */
.col-heads{display:grid;grid-template-columns:26px 20px 1fr 1fr 26px;gap:5px;padding:5px 14px 4px;border-bottom:1px solid var(--line);}
.col-head{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:center;}
/* Sets */
.sets-body{padding:5px 14px;}
.set-row{display:grid;grid-template-columns:26px 20px 1fr 1fr 26px;gap:5px;align-items:center;margin-bottom:5px;}
/* Set start button */
.set-start-btn{width:18px;height:22px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:3px;flex-shrink:0;transition:color .15s;}
.set-start-btn.done{color:var(--green);}
.set-start-btn:active{opacity:.6;}
/* Exercise reorder buttons */
.ex-mv-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:10px;padding:0;width:16px;height:13px;display:flex;align-items:center;justify-content:center;line-height:1;transition:color .15s;}
.ex-mv-btn:not(:disabled):hover,.ex-mv-btn:not(:disabled):active{color:var(--ink2);}
.ex-mv-btn:disabled{cursor:default;color:var(--line);}
/* Session timing row */
.sess-time-row{display:flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:7px;padding:8px 14px;margin-bottom:10px;}
.sess-time-block{display:flex;align-items:center;gap:5px;flex:1;min-width:0;}
.sess-time-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);flex-shrink:0;}
.sess-time-val{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:var(--ink);flex:1;}
.sess-time-btn{background:var(--accent);border:none;border-radius:5px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;padding:4px 8px;font-family:inherit;flex-shrink:0;}
.sess-time-btn:active{opacity:.6;}
.sess-time-sep{font-size:14px;color:var(--muted);flex-shrink:0;}
.sess-time-input{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:var(--ink);background:none;border:none;border-bottom:1.5px solid var(--line);padding:2px 0;width:76px;flex-shrink:0;cursor:text;}
.sess-time-input:focus{outline:none;border-bottom-color:var(--ink);}
.sess-time-dur{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;flex-shrink:0;}
/* History timing row */
.hist-times{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px 6px;border-bottom:1px dashed var(--line);margin-bottom:6px;}
.hist-time-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.hist-time-input{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:var(--ink);background:none;border:none;border-bottom:1.5px solid var(--line);padding:1px 0;width:72px;cursor:text;}
.hist-time-input:focus{outline:none;border-bottom-color:var(--ink);}
.hist-set-time{font-size:9px;font-family:'DM Mono',monospace;color:var(--muted);white-space:nowrap;}
/* Notes label */
.notes-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:8px;margin-bottom:2px;}
/* Delete session button */
.del-sess-btn{width:100%;background:rgba(255,85,85,.08);border:1.5px solid rgba(255,85,85,.35);border-radius:8px;padding:11px;font-size:13px;font-weight:700;color:var(--danger);cursor:pointer;margin-top:16px;font-family:inherit;}
.del-sess-btn:active{background:rgba(255,85,85,.15);}
/* Adhoc search dropdown */
.adhoc-search-drop{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--white);border:1px solid var(--line);border-radius:6px;z-index:50;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.adhoc-search-result{width:100%;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between;align-items:center;background:var(--white);border-left:none;border-right:none;border-top:none;border-radius:0;text-align:left;font-family:'DM Sans',sans-serif;color:var(--ink);}
.adhoc-search-result:last-child{border-bottom:none;}
.adhoc-search-result:active,.adhoc-search-result:focus{background:var(--bg);outline:none;}
.set-num{width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,color .2s;background:var(--line);color:var(--muted);}
.set-num.filled{background:var(--sess-color);color:#fff;}
.set-input{width:100%;border:1px solid var(--line);border-radius:5px;padding:7px 5px;font-size:15px;font-weight:700;font-family:'DM Mono',monospace;text-align:center;background:var(--bg);transition:border-color .15s,background .15s;-moz-appearance:textfield;}
.set-input::-webkit-outer-spin-button,.set-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.set-input:focus{outline:none;border-color:var(--sess-color);background:var(--white);}
.set-input.weight-input{color:var(--sess-color);}.set-input.reps-input{color:var(--ink);}
.rm-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:0;transition:color .15s;display:flex;align-items:center;justify-content:center;width:22px;height:22px;}
.rm-btn:hover:not(:disabled){color:var(--danger);}.rm-btn:disabled{cursor:default;color:var(--line);}
/* Ex footer */
.ex-footer{padding:5px 14px 10px;}
.add-set-btn{width:100%;background:none;border:1px dashed var(--sess-color);border-radius:5px;padding:5px;font-size:11px;font-weight:700;color:var(--sess-color);cursor:pointer;margin-top:2px;font-family:'DM Sans',sans-serif;transition:background .15s;}
.add-set-btn:hover{background:rgba(255,255,255,.05);}
.notes-input{width:100%;border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:12px;color:var(--ink2);background:var(--bg);font-family:'DM Sans',sans-serif;margin:5px 0 6px;}
.notes-input:focus{outline:none;border-color:var(--muted);}
.notes-input::placeholder{color:var(--muted);}
.ex-volume{font-size:10px;color:var(--muted);text-align:right;font-family:'DM Mono',monospace;margin-top:2px;}
.ex-volume span{color:var(--sess-color);font-weight:700;}

/* ── REST TIMER ── */
.timer-overlay{position:fixed;top:0;left:0;right:0;z-index:500;background:#06060C;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 24px rgba(0,0,0,.6);transform:translateY(-100%);transition:transform .25s ease;}
.timer-overlay.visible{transform:translateY(0);}
.timer-ring{width:44px;height:44px;flex-shrink:0;position:relative;}
.timer-ring svg{width:44px;height:44px;transform:rotate(-90deg);}
.timer-ring circle{fill:none;stroke-width:3;}
.timer-ring .bg{stroke:rgba(255,255,255,.1);}
.timer-ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .9s linear;}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:#fff;}
.timer-info{flex:1;min-width:0;}
.timer-label{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:2px;text-transform:uppercase;}
.timer-ex{font-size:12px;font-weight:600;color:var(--ink);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.timer-goal-tag{display:inline-block;font-size:9px;font-weight:700;color:var(--gold);letter-spacing:.5px;margin-top:2px;}
.timer-actions{display:flex;gap:6px;flex-shrink:0;}
.timer-btn{background:rgba(255,255,255,.1);border:none;border-radius:5px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;padding:5px 8px;font-family:'DM Sans',sans-serif;}
.timer-btn.dismiss{background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);}
.timer-btn:active{opacity:.7;}

/* ── REST CHIP (manual trigger in log) ── */
.rest-chip-row{padding:8px 16px 0;}
.rest-chip{display:flex;align-items:center;gap:10px;background:var(--white);border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s;}
.rest-chip:active{opacity:.65;}
.rest-chip-emoji{font-size:20px;flex-shrink:0;}
.rest-chip-info{flex:1;min-width:0;}
.rest-chip-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;}
.rest-chip-detail{font-size:13px;font-weight:700;color:var(--ink);margin-top:1px;}
.rest-chip-cta{font-size:11px;font-weight:600;color:#fff;background:var(--accent);border-radius:6px;padding:4px 10px;flex-shrink:0;}

/* ── GOAL SELECTOR in editor ── */
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px;}
.goal-card{border:2px solid var(--line);border-radius:10px;padding:11px 10px;cursor:pointer;transition:all .15s;background:var(--white);text-align:center;-webkit-tap-highlight-color:transparent;}
.goal-card:active{opacity:.8;}
.goal-card.sel{color:#fff;}
.goal-card-emoji{font-size:22px;margin-bottom:3px;}
.goal-card-name{font-size:12px;font-weight:700;line-height:1.2;}
.goal-card-rest{font-size:11px;margin-top:2px;opacity:.75;font-family:'DM Mono',monospace;}
.goal-card-desc{font-size:10px;margin-top:3px;opacity:.55;line-height:1.3;}


/* ── HOME PAGE ── */
.home-hero{border-radius:14px;padding:18px 18px 14px;margin-bottom:12px;background:var(--white);border:1px solid var(--line);}
.home-hero-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:6px;}
.home-hero-score{font-family:'DM Mono',monospace;font-size:68px;font-weight:800;line-height:1;}
.home-hero-divider{border:none;border-top:1px solid var(--line);margin:12px 0 10px;}
.home-hero-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
.home-hero-metric{text-align:center;padding:0 4px;}
.home-hero-metric+.home-hero-metric{border-left:1px solid var(--line);}
.home-hero-mval{font-family:'DM Mono',monospace;font-size:16px;font-weight:700;color:var(--ink);line-height:1.2;}
.home-hero-mlbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}
.home-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.home-tile{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 8px 13px;text-align:center;}
.home-tile-icon{font-size:22px;margin-bottom:6px;}
.home-tile-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:800;color:var(--ink);line-height:1.1;}
.home-tile-lbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:5px;}
.home-tile-sub{font-size:9px;color:var(--muted);margin-top:2px;}
.hist-strain-row{display:flex;align-items:center;gap:8px;padding:6px 14px 4px;border-top:1px solid var(--line);}
/* ── HOME v2 stat tiles ── */
.home-stat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.home-stat-tile{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;}
.hst-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:700;line-height:1;margin-bottom:5px;}
.hst-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);}
.home-sess-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;}

/* ── SESIONES PAGE ── */
.sess-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
.archived-sess-section{margin-top:24px;border-top:1px solid var(--line);padding-top:16px;}
.archived-sess-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px;}
.archived-sess-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg);border-radius:10px;margin-bottom:8px;}
.archived-sess-name{font-size:14px;font-weight:600;color:var(--ink);}
.archived-sess-meta{font-size:11px;color:var(--muted);margin-left:8px;}
.archived-restore-btn{border:none;background:var(--white);color:var(--ink);font-size:12px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--line);font-family:inherit;}
.sess-card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.sess-card-accent{height:4px;}
.sess-card-body{padding:14px 16px 12px;}
.sess-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.sess-card-info{flex:1;}
.sess-card-name{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;}
.sess-card-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.sess-card-meta{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.sess-card-pill{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--ink2);border:1px solid var(--line);}
.sess-card-actions{display:flex;gap:8px;}
.sess-btn-train{flex:1;padding:12px 0;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;letter-spacing:.2px;}
.sess-btn-edit{padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink2);}
.sess-btn-edit:hover{background:var(--bg);}
.sess-new-btn{width:100%;padding:16px;border:2px dashed var(--line);border-radius:16px;background:none;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;}
.sess-new-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg);}
.sess-page-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#06060C;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;z-index:600;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── SAVE BAR ── */
.save-bar{position:fixed;bottom:calc(52px + env(safe-area-inset-bottom));left:0;right:0;background:var(--white);border-top:1px solid var(--line);padding:12px 16px;z-index:300;}
.save-btn{width:100%;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;transition:background .3s,transform .1s;font-family:'DM Sans',sans-serif;color:#fff;letter-spacing:.3px;}
.save-btn:active{transform:scale(.98);}

/* ── HISTORY ── */
.hist-item{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--sess-color);border-radius:7px;overflow:hidden;margin-bottom:10px;}
.hist-toggle-row{display:flex;align-items:stretch;}
.hist-toggle{flex:1;min-width:0;background:none;border:none;cursor:pointer;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-family:'DM Sans',sans-serif;}
.hist-strain-btn{flex-shrink:0;background:none;border:none;border-left:1px solid var(--line);cursor:pointer;padding:8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;font-family:'DM Sans',sans-serif;}
.hist-date{font-size:14px;font-weight:600;color:var(--ink);}
.hist-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.hist-arrow{font-size:14px;color:var(--muted);}
.hist-body{border-top:1px solid var(--line);padding:0 16px 10px;}
.hist-ex{padding:7px 0;border-bottom:1px solid var(--line);}
.hist-ex:last-child{border-bottom:none;}
.hist-ex-name{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:2px;display:flex;align-items:center;gap:5px;}
.hist-sets{font-family:'DM Mono',monospace;font-size:12px;color:var(--sess-color);font-weight:600;}
.hist-notes{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px;}
.hist-vol{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:3px;}
.hist-del-btn{background:none;border:1px solid rgba(255,85,85,.3);border-radius:5px;color:var(--danger);font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer;margin-top:8px;font-family:'DM Sans',sans-serif;}

/* ── CHARTS ── */
.ex-selector{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.ex-chip{border-radius:4px;padding:6px 11px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--white);color:var(--ink2);font-family:'DM Sans',sans-serif;transition:all .15s;}
.ex-chip.active{color:#fff;font-weight:700;}.ex-chip .chip-count{font-size:10px;opacity:.6;margin-left:4px;}
.chart-stats{border-radius:8px;padding:14px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
.cs-item{text-align:center;}.cs-val{font-family:'DM Mono',monospace;font-size:16px;font-weight:700;color:#fff;line-height:1;}
.cs-key{font-size:9px;color:rgba(255,255,255,.45);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.chart-box{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 8px 8px;margin-bottom:12px;}
.chart-title{font-size:12px;font-weight:600;color:var(--ink2);padding-left:8px;margin-bottom:10px;}
.chart-svg{width:100%;overflow:visible;}
.chart-line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.chart-dot{stroke:none;}.chart-grid{stroke:var(--line);stroke-width:1;}
.chart-label{font-family:'DM Mono',monospace;font-size:9px;fill:var(--muted);}
/* ── MUSCLE CHART ── */
.muscle-seg{cursor:pointer;transition:opacity .12s;}
.muscle-legend-row{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;}
.muscle-exrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);}
.muscle-exrow:last-child{border-bottom:none;}
.muscle-mode-tabs{display:flex;gap:6px;margin-bottom:14px;}
.muscle-mode-tab{flex:1;padding:7px 6px;font-size:11px;font-weight:600;background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;}
.muscle-mode-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── LIBRARY ── */
.muscle-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.mtab{border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--white);color:var(--ink2);font-family:'DM Sans',sans-serif;transition:all .15s;flex-shrink:0;}
.mtab.active{color:#fff;border-color:transparent;}
.lib-grid{display:flex;flex-direction:column;gap:10px;}
.lib-card{background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.lib-card-head{display:flex;gap:12px;padding:12px;cursor:pointer;}
.lib-thumb{width:72px;height:72px;border-radius:6px;object-fit:cover;background:var(--bg);flex-shrink:0;}
.lib-thumb-placeholder{width:72px;height:72px;border-radius:6px;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;}
.lib-info{flex:1;min-width:0;}
.lib-name{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px;}
.lib-muscle{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.lib-desc{font-size:11px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.lib-expand{border-top:1px solid var(--line);padding:12px;display:none;}
.lib-expand.open{display:block;}
.lib-expand img{width:100%;border-radius:6px;margin-bottom:10px;max-height:200px;object-fit:cover;}
.lib-steps{padding-left:16px;}
.lib-steps li{font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:4px;}
.lib-loading{text-align:center;padding:40px 20px;color:var(--muted);}
.lib-loading .spin{font-size:28px;display:inline-block;animation:spin 1s linear infinite;margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.lib-error{text-align:center;padding:30px 20px;color:var(--muted);}

/* ── WORKOUT EDITOR ── */
.editor-section{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px;}
.editor-section h3{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.editor-section p{font-size:12px;color:var(--muted);margin-bottom:12px;}
.sess-name-input,.sess-sub-input{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px 11px;font-size:13px;color:var(--ink);font-family:'DM Sans',sans-serif;background:var(--bg);margin-bottom:8px;}
.sess-name-input:focus,.sess-sub-input:focus{outline:none;border-color:var(--ink);}
.ed-ex-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.ed-ex-row{background:var(--bg);border-radius:6px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;}
.ed-ex-handle{display:flex;flex-direction:column;gap:2px;flex-shrink:0;margin-top:2px;}
.ed-mv-btn{background:none;border:1px solid var(--line);border-radius:3px;width:22px;height:16px;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.ed-ex-fields{flex:1;display:flex;flex-direction:column;gap:5px;}
.ed-field{display:flex;gap:6px;align-items:center;}
.ed-field label{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;width:40px;flex-shrink:0;}
.ed-input{flex:1;border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--ink);}
.ed-input:focus{outline:none;border-color:var(--ink);}
.ed-select{flex:1;border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--ink);}
.ed-del-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;flex-shrink:0;padding:0;transition:color .15s;}
.ed-del-btn:hover{color:var(--danger);}
.add-ex-btn{width:100%;background:none;border:1.5px dashed var(--line);border-radius:6px;padding:10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.add-ex-btn:hover{border-color:var(--accent);color:var(--accent);}
.save-plan-btn{width:100%;border:none;border-radius:7px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;color:#fff;background:var(--accent);margin-top:10px;transition:opacity .15s;}
.save-plan-btn:hover{opacity:.85;}

/* ── DATA PAGE ── */
.data-section{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:12px;}
.data-section h3{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.data-section p{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5;}
.data-btn{width:100%;border:none;border-radius:7px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .15s;}
.data-btn:hover{opacity:.85;}.data-btn.export{background:var(--accent);color:#fff;}
.data-btn.import{background:var(--white);color:var(--ink);border:2px solid var(--line);}
.data-btn.danger{background:rgba(255,85,85,.1);color:var(--danger);border:2px solid rgba(255,85,85,.3);}
.data-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.ds-item{background:var(--bg);border-radius:6px;padding:10px;text-align:center;}
.ds-val{font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:var(--ink);}
.ds-key{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.import-area{width:100%;border:2px dashed var(--line);border-radius:7px;padding:10px;font-size:12px;color:var(--ink2);background:var(--bg);font-family:'DM Mono',monospace;resize:vertical;min-height:90px;margin-bottom:8px;}
.import-area:focus{outline:none;border-color:var(--ink);}
.msg{border-radius:5px;padding:9px 12px;font-size:12px;font-weight:600;margin-top:8px;display:none;}
.msg.ok{background:rgba(46,204,154,.1);color:var(--green);border:1px solid rgba(46,204,154,.3);}
.msg.err{background:rgba(255,85,85,.1);color:var(--danger);border:1px solid rgba(255,85,85,.3);}
.google-btn{width:100%;border:2px solid var(--line);border-radius:7px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color .15s,box-shadow .15s;}
.google-btn:hover{border-color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.4);}
.sync-info{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--ink2);}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sync-dot.green{background:#4ade80;}.sync-dot.gray{background:#9ca3af;}.sync-dot.blue{background:#60a5fa;}.sync-dot.red{background:#f87171;}
.install-steps{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
.install-step{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:6px;padding:9px 12px;}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-text{font-size:12px;color:var(--ink2);}
.step-text b{color:var(--ink);}

/* ── EMPTY / TOOLTIP ── */
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:12px;}.empty-title{font-size:15px;font-weight:600;color:var(--ink2);margin-bottom:6px;}.empty-sub{font-size:12px;}
.tooltip{position:fixed;background:#06060C;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 11px;font-size:12px;pointer-events:none;z-index:1000;font-family:'DM Mono',monospace;transform:translate(-50%,-110%);box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap;}
.tooltip::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#06060C;border-bottom:none;}

/* ── EJERCICIOS SUB-TABS ── */
.sub-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:14px;}
.subtab{background:none;border:none;cursor:pointer;padding:9px 14px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;font-family:'DM Sans',sans-serif;}
.subtab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}

/* ── EXERCISE ALTERNATIVES ── */
.alt-trigger{font-size:10px;color:var(--gold);font-weight:700;cursor:pointer;letter-spacing:.4px;text-transform:uppercase;border:none;background:none;font-family:'DM Sans',sans-serif;padding:0;transition:color .15s;text-decoration:underline dotted;}
.alt-trigger:hover{color:var(--ink);}
.alt-box{background:rgba(232,160,48,.08);border:1px solid rgba(232,160,48,.25);border-radius:6px;padding:8px 12px;margin-top:5px;display:none;}
.alt-box.open{display:block;}
.alt-box-label{font-size:9px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;font-weight:700;}
.alt-item{font-size:12px;color:var(--ink2);padding:4px 0;display:flex;align-items:center;gap:6px;}
.alt-item::before{content:'↔';color:var(--gold);font-size:11px;}
.alt-item:not(:last-child){border-bottom:1px solid rgba(232,160,48,.2);}

/* ── EXERCISE SEARCH (Editor inline) ── */
.ex-search-wrap{position:relative;flex:1;}
.ex-dropdown{position:absolute;left:0;right:0;top:calc(100% + 2px);background:var(--white);border:1.5px solid var(--ink);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:400;max-height:180px;overflow-y:auto;display:none;}
.ex-dropdown.open{display:block;}
.ex-drop-item{padding:8px 12px;font-size:12px;color:var(--ink2);cursor:pointer;border-bottom:1px solid var(--bg);font-family:'DM Sans',sans-serif;}
.ex-drop-item:last-child{border-bottom:none;}
.ex-drop-item:hover{background:var(--bg);color:var(--ink);}
.ex-drop-item .cat-tag{font-size:9px;color:var(--muted);margin-left:5px;text-transform:uppercase;letter-spacing:.8px;}

/* ── EXERCISE PICKER PANEL ── */
.ex-picker{background:var(--white);border:1.5px solid var(--ink);border-radius:10px;margin:8px 0 12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.12);}
.picker-top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--accent);}
.picker-search-input{flex:1;border:none;border-radius:6px;padding:10px 12px;font-size:14px;font-family:'DM Sans',sans-serif;background:rgba(0,0,0,.3);color:#fff;min-width:0;}
.picker-search-input::placeholder{color:rgba(255,255,255,.5);}
.picker-search-input:focus{outline:none;}
.picker-cancel-btn{background:rgba(0,0,0,.2);border:none;border-radius:6px;color:rgba(255,255,255,.8);font-size:18px;line-height:1;width:32px;height:32px;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.picker-cats{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg);-webkit-overflow-scrolling:touch;}
.picker-cats::-webkit-scrollbar{display:none;}
.picker-cat-pill{border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:var(--white);color:var(--ink2);font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0;transition:all .15s;}
.picker-scroll{max-height:270px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.picker-status{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;}
.picker-cat-hdr{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:10px 14px 5px;color:var(--muted);position:sticky;top:0;background:var(--white);z-index:2;}
.picker-ex-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .1s;-webkit-tap-highlight-color:transparent;}
.picker-ex-item:active{background:var(--bg);}
.picker-ex-name{font-size:13px;font-weight:500;color:var(--ink);line-height:1.3;}
.picker-add-icon{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:300;}
.picker-see-all{padding:6px 14px 12px;font-size:11px;color:var(--gold);font-weight:700;cursor:pointer;display:block;}
.picker-free-row{padding:10px 12px;border-top:1.5px solid var(--line);}
.picker-free-btn{width:100%;background:none;border:1.5px dashed var(--line);border-radius:7px;padding:11px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;transition:all .15s;}
.picker-free-btn:hover,.picker-free-btn:active{border-color:var(--accent);color:var(--accent);}
.picker-load-bar{height:3px;background:linear-gradient(90deg,var(--gold) 30%,transparent 60%);background-size:200%;animation:loadslide 1s linear infinite;}
@keyframes loadslide{from{background-position:100%}to{background-position:-100%}}

/* ── MUSCLE SVG THUMBNAIL ── */
.lib-muscle-svg{width:72px;height:72px;border-radius:6px;background:var(--bg);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.muscle-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:3px;}

/* ── LIBRARY CARD V2 (free-exercise-db) ── */
.lib-level{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.3px;text-transform:capitalize;}
.lib-equip{font-size:9px;padding:2px 7px;border-radius:10px;background:var(--bg);color:var(--muted);letter-spacing:.2px;}
.lib-muscles{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4;}
.lib-muscles b{color:var(--ink2);font-weight:600;}
.lib-img-row{display:flex;gap:6px;margin-bottom:12px;}
.lib-img-row img{flex:1;min-width:0;border-radius:8px;object-fit:cover;max-height:170px;background:var(--bg);}
.lib-steps-ordered{padding-left:18px;margin:0;}
.lib-steps-ordered li{font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:5px;padding-left:2px;}
.lib-card-meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.lib-fetch-bar{height:2px;background:linear-gradient(90deg,var(--gold) 0%,transparent 60%);background-size:200%;animation:loadslide 1s linear infinite;margin-bottom:4px;}

/* ── EXERCISE PHOTO ── */
.ex-photo{width:48px;height:48px;border-radius:8px;object-fit:cover;cursor:pointer;flex-shrink:0;border:2px solid var(--line);transition:opacity .15s;}
.ex-photo:active{opacity:.75;}
.ex-photo-btn{width:36px;height:36px;border-radius:7px;background:var(--bg);border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;color:var(--muted);transition:border-color .15s;}
.ex-photo-btn:hover{border-color:var(--muted);}

// ─────────────────────────────────────────────────────────────────
// REST TIMER
// ─────────────────────────────────────────────────────────────────
const timerState={active:false,remaining:0,duration:90,total:90,interval:null,exName:''};
const ARC_CIRC=2*Math.PI*19; // r=19

function startTimer(exName){
  if(timerState.interval)clearInterval(timerState.interval);
  const dur=getRestDuration(); // dynamic — based on session goal
  timerState.active=true;
  timerState.duration=dur;
  timerState.remaining=dur;
  timerState.total=dur;
  timerState.exName=exName;
  renderTimerOverlay();
  timerState.interval=setInterval(tickTimer,1000);
}
function tickTimer(){
  timerState.remaining--;
  if(timerState.remaining<=0){
    timerState.remaining=0;
    clearInterval(timerState.interval);
    timerState.active=false;
    renderTimerOverlay();
    playBeep();
  } else renderTimerOverlay();
}
function stopTimer(){
  clearInterval(timerState.interval);
  timerState.active=false;timerState.remaining=0;
  document.getElementById('timer-overlay').classList.remove('visible');
}
function adjustTimer(delta){
  timerState.remaining=Math.max(5,Math.min(600,timerState.remaining+delta));
  timerState.total=Math.max(timerState.total,timerState.remaining);
  renderTimerOverlay();
}
function renderTimerOverlay(){
  const overlay=document.getElementById('timer-overlay');
  const numEl=document.getElementById('timer-num');
  const arcEl=document.getElementById('timer-arc');
  const exEl=document.getElementById('timer-ex-name');
  const goalEl=document.getElementById('timer-goal-tag');
  if(!overlay)return;
  if(!timerState.active&&timerState.remaining===0){overlay.classList.remove('visible');return;}
  overlay.classList.add('visible');
  const m=Math.floor(timerState.remaining/60);
  const s=timerState.remaining%60;
  numEl.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  const pct=timerState.total>0?timerState.remaining/timerState.total:1;
  const offset=ARC_CIRC*(1-pct);
  arcEl.style.strokeDasharray=ARC_CIRC;
  arcEl.style.strokeDashoffset=offset;
  exEl.textContent=timerState.exName||'–';
  if(goalEl){const g=getRestGoal();goalEl.textContent=`${g.emoji} ${g.label}`;}
  // Arc color: gold → red as time runs out
  if(pct<0.25)arcEl.style.stroke='#f87171';
  else if(pct<0.5)arcEl.style.stroke='#fbbf24';
  else arcEl.style.stroke='var(--gold)';
}
function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,0.15,0.3].forEach(t=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;o.type='sine';
      g.gain.setValueAtTime(0.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.2);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.25);
    });
  }catch(e){}
}

// ─────────────────────────────────────────────────────────────────
// PR DETECTION
// ─────────────────────────────────────────────────────────────────
function getHistoricMax(exId,excludeDate){
  const altId=findExIdByName(findExerciseName(exId)||'',exId);
  return Object.values(allLogs)
    .filter(l=>!excludeDate||l.date!==excludeDate)
    .flatMap(l=>{
      const direct=(l.data[exId]?.sets||[]).map(s=>parseFloat(s.weight)||0);
      const alt=altId?(l.data[altId]?.sets||[]).map(s=>parseFloat(s.weight)||0):[];
      return [...direct,...alt];
    })
    .reduce((mx,w)=>Math.max(mx,w),0);
}
function getCurrentMax(exId){
  return(formData[exId]?.sets||[]).map(s=>parseFloat(s.weight)||0).reduce((mx,w)=>Math.max(mx,w),0);
}
function isCurrentPR(exId){
  const cur=getCurrentMax(exId);
  if(!cur)return false;
  return cur>getHistoricMax(exId,currentDate);
}
function detectAndShowPRs(){
  const sess=workoutDefs[currentSession];
  const prs=[];
  sess.exercises.forEach(ex=>{
    const cur=getCurrentMax(ex.id);
    if(!cur)return;
    const hist=getHistoricMax(ex.id,currentDate);
    if(cur>hist)prs.push({name:ex.name,weight:cur,unit:ex.unit});
  });
  if(prs.length>0){
    const msg=prs.length===1
      ?`🏆 PR: ${prs[0].name} — ${prs[0].weight}${prs[0].unit}`
      :`🏆 ${prs.length} new PRs this session`;
    showToast(msg,3500);
  }
}

// ─────────────────────────────────────────────────────────────────
// VOLUME
// ─────────────────────────────────────────────────────────────────
function calcExVolume(exId,data){
  const d=data||(formData[exId]);
  if(!d?.sets)return 0;
  return d.sets.reduce((t,s)=>{
    const w=parseFloat(s.weight)||0,r=parseInt(s.reps)||0;
    return t+(w*r);
  },0);
}
function calcSessionVolume(){
  const sessVol=(workoutDefs[currentSession]?.exercises||[]).reduce((t,ex)=>t+calcExVolume(ex.id),0);
  const adhocVol=adhocExercises.reduce((t,ex)=>t+calcExVolume(ex.id),0);
  return sessVol+adhocVol;
}
function fmtVol(v){return v>=1000?(v/1000).toFixed(1)+'t':v.toFixed(0)+' kg'}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}
function fmtTime24(iso){const d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtDuration(isoStart,isoEnd){const m=Math.round((new Date(isoEnd)-new Date(isoStart))/60000);if(m<0||m>600)return'';return m<60?m+'min':Math.floor(m/60)+'h '+(m%60)+'min'}

// ─────────────────────────────────────────────────────────────────
// COMPARE WITH LAST SESSION
// ─────────────────────────────────────────────────────────────────
function getLastSessionData(exId){
  const altId=findExIdByName(findExerciseName(exId)||'',exId);
  const logs=Object.values(allLogs)
    .filter(l=>{
      if(l.date===currentDate&&l.session===currentSession)return false;
      if(l.data[exId]?.sets?.some(s=>s.weight||s.reps))return true;
      if(altId&&l.data[altId]?.sets?.some(s=>s.weight||s.reps))return true;
      return false;
    })
    .sort((a,b)=>b.date.localeCompare(a.date));
  if(!logs[0])return null;
  const log=logs[0];
  const data=log.data[exId]||(altId?log.data[altId]:null);
  return data?{log,data}:null;
}

function handlePhotoFile(e){
  const file=e.target.files[0];
  if(!file||!photoPendingExId)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const SIZE=240;canvas.width=SIZE;canvas.height=SIZE;
      const ctx=canvas.getContext('2d');
      const ratio=Math.max(SIZE/img.width,SIZE/img.height);
      const sw=SIZE/ratio,sh=SIZE/ratio;
      const sx=(img.width-sw)/2,sy=(img.height-sh)/2;
      ctx.drawImage(img,sx,sy,sw,sh,0,0,SIZE,SIZE);
      exPhotos[photoPendingExId]=canvas.toDataURL('image/jpeg',.82);
      saveExPhotos();
      closePhotoModal();
      renderLog();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function showPhotoModal(exId){
  photoPendingExId=exId;
  const photo=exPhotos[exId];
  if(!photo){pickExPhoto(exId);return;}
  document.getElementById('photo-modal-img').src=photo;
  document.getElementById('photo-modal').style.display='flex';
}
function closePhotoModal(){document.getElementById('photo-modal').style.display='none';}

function showAdHocForm(){adhocShowForm=true;renderLog();setTimeout(()=>document.getElementById('adhoc-name-input')?.focus(),60);}
function hideAdHocForm(){adhocShowForm=false;renderLog();}
function addAdHocExercise(){
  const name=(document.getElementById('adhoc-name-input')?.value||'').trim();
  if(!name){showToast('Enter a name');return;}
  const unit=document.getElementById('adhoc-unit-select')?.value||'kg';
  const nSets=Math.max(1,parseInt(document.getElementById('adhoc-sets-input')?.value)||1);
  const weight=document.getElementById('adhoc-weight-input')?.value||'';
  const reps=document.getElementById('adhoc-reps-input')?.value||'';
  const setsLabel=weight||reps?`${nSets}×${reps||'?'}`+(weight?` ${weight}${unit}`:''):`${nSets} sets`;
  const id='adhoc_'+Date.now();
  adhocExercises.push({id,name,unit,sets:setsLabel,note:''});
  // pre-fill set data so the card shows with weight/reps already entered
  formData[id]={notes:'',sets:Array.from({length:nSets},()=>({weight,reps}))};
  adhocShowForm=false;
  renderLog();
}
function removeAdHocExercise(id){
  adhocExercises=adhocExercises.filter(e=>e.id!==id);
  delete formData[id];
  renderLog();
}
function moveAdHocExercise(id,delta){
  const idx=adhocExercises.findIndex(e=>e.id===id);
  if(idx<0)return;
  const ni=idx+delta;if(ni<0||ni>=adhocExercises.length)return;
  [adhocExercises[idx],adhocExercises[ni]]=[adhocExercises[ni],adhocExercises[idx]];
  saveDraft();renderLog();
}

function findExerciseName(exId){
  for(const sess of Object.values(workoutDefs)){
    const ex=sess.exercises?.find(e=>e.id===exId);
    if(ex)return ex.name;
  }

}
function findExIdByName(name,excludeId){
  const n=name.toLowerCase();
  for(const sess of Object.values(workoutDefs)){
    const ex=sess.exercises?.find(e=>e.id!==excludeId&&e.name.toLowerCase()===n);
    if(ex)return ex.id;
  }
  return null;
}

function loadFormFromLogs(){
  const key=logKey();
  sessionStartTime=null;sessionEndTime=null;
  if(allLogs[key]){
    formData=JSON.parse(JSON.stringify(allLogs[key].data));
    adhocExercises=JSON.parse(JSON.stringify(allLogs[key].adhocExercises||[]));
    sessionStartTime=allLogs[key].startTime||null;
    sessionEndTime=allLogs[key].endTime||null;
    clearDraft();return;
  }
  const draft=loadDraft();
  if(draft?.session===currentSession&&draft?.date===currentDate){
    formData=draft.data;
    adhocExercises=draft.adhocExercises||[];
    sessionStartTime=draft.sessionStartTime||null;
    sessionEndTime=draft.sessionEndTime||null;
    return;
  }
  formData={};adhocExercises=[];
  const _ps=workoutDefs[currentSession];
  if(_ps?.exercises){
    for(const _ex of _ps.exercises){
      const _last=getLastSessionData(_ex.id);
      if(_last){
        const _sets=_last.data.sets.filter(s=>s.weight||s.reps);
        if(_sets.length>0)formData[_ex.id]={sets:_sets.map(s=>({weight:s.weight||'',reps:s.reps||''})),notes:''};
      }
    }
  }
}
function getExData(exId){
  if(!formData[exId])formData[exId]={sets:[{weight:'',reps:''}],notes:''};
  if(!formData[exId].sets?.length)formData[exId].sets=[{weight:'',reps:''}];
  return formData[exId];
}
function updateWeight(exId,idx,val){
  getExData(exId).sets[idx].weight=val;
  document.querySelector(`[data-num="${exId}-${idx}"]`)?.classList.toggle('filled',!!val);
  document.querySelector(`[data-card="${exId}"]`)?.classList.toggle('has-data',hasData(exId));
  updateExVolume(exId);
  updatePRBadge(exId);
  updateSessionVolume();
  saveDraft();
}
function updateReps(exId,idx,val){
  getExData(exId).sets[idx].reps=val;
  updateExVolume(exId);updateSessionVolume();saveDraft();
}
function updateNotes(exId,val){getExData(exId).notes=val;saveDraft();}
function onSetBlur(exId,idx){
  // auto-start timer if both weight and reps filled
  checkAutoTimer(exId,idx);
}
function addSet(exId){
  const d=getExData(exId);const last=d.sets[d.sets.length-1]||{};
  d.sets.push({weight:last.weight||'',reps:last.reps||''});
  renderSetsFor(exId);updateExVolume(exId);updateSessionVolume();saveDraft();
}
function removeSet(exId,idx){
  const d=getExData(exId);if(d.sets.length<=1)return;
  d.sets.splice(idx,1);renderSetsFor(exId);updateExVolume(exId);updateSessionVolume();saveDraft();
}
function hasData(exId){return formData[exId]?.sets?.some(s=>s.weight||s.reps);}
function updateExVolume(exId){
  const el=document.querySelector(`[data-vol="${exId}"]`);
  if(!el)return;
  const v=calcExVolume(exId);
  if(v>0)el.innerHTML=`Vol: <span>${fmtVol(v)}</span>`;else el.textContent='';
}
function updatePRBadge(exId){
  const el=document.querySelector(`[data-pr="${exId}"]`);
  if(!el)return;
  el.classList.toggle('show',isCurrentPR(exId));
}
function updateSessionVolume(){
  const el=document.getElementById('session-vol');
  if(!el)return;
  const v=calcSessionVolume();
  el.querySelector('.sv-val').textContent=v>0?fmtVol(v)+'  total':'—';
}

function renderExCard(ex,color,bg,isAdhoc=false){
  const d=getExData(ex.id);

  const wLabel=ex.unit==='min'?'Duration':ex.unit==='km/h'?'Speed':'Weight';
  const last=getLastSessionData(ex.id);
  const isPR=isCurrentPR(ex.id);
  const vol=calcExVolume(ex.id);

  // Build "last time" string
  let lastHtml='';
  if(last){
    const sets=last.data.sets.filter(s=>s.weight||s.reps);
    const str=sets.map(s=>`${s.weight?s.weight+ex.unit:'—'}${s.reps?' ×'+s.reps:''}`).join(' · ');
    lastHtml=`<div class="last-time">↩ ${fmtShort(last.log.date)}: <span>${escHtml(str)}</span></div>`;
  }

  const photo=exPhotos[ex.id];
  return`<div class="ex-card${filled?' has-data':''}" data-card="${ex.id}" style="--sess-color:${color};--sess-bg:${bg}">
    <div class="ex-head" style="gap:10px">
      ${photo
        ?`<img class="ex-photo" src="${photo}" onclick="showPhotoModal('${ex.id}')" alt="">`
        :`<div class="ex-photo-btn" onclick="pickExPhoto('${ex.id}')">📷</div>`}
      <div style="flex:1;min-width:0">
        <div class="ex-name-row">
          <span class="ex-name">${ex.name}</span>
          ${isAdhoc?'<span class="adhoc-badge">EXTRA</span>':''}
          <span class="pr-badge${isPR?' show':''}" data-pr="${ex.id}">🏆 PR</span>
        </div>
        <div class="ex-meta">
          ${ex.sets?`<span class="ex-target" style="color:${color};background:${bg};border:1px solid ${color}33">${ex.sets}</span>`:''}
          ${ex.note?`<span class="ex-ref">${ex.note}</span>`:''}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
        <div style="display:flex;flex-direction:column;gap:2px;margin-right:2px">
          ${isAdhoc
            ?`<button class="ex-mv-btn" onclick="moveAdHocExercise('${ex.id}',-1)" title="Move up">▲</button>
               <button class="ex-mv-btn" onclick="moveAdHocExercise('${ex.id}',+1)" title="Move down">▼</button>`
            :`<button class="ex-mv-btn" onclick="moveExercise('${ex.id}',-1)" title="Move up">▲</button>
               <button class="ex-mv-btn" onclick="moveExercise('${ex.id}',+1)" title="Move down">▼</button>`}
        </div>
        ${filled?'<span style="font-size:14px">✅</span>':''}
        ${isAdhoc?`<button onclick="removeAdHocExercise('${ex.id}')" style="background:none;border:none;color:#ccc;font-size:22px;cursor:pointer;padding:0;line-height:1">×</button>`:''}
      </div>
    </div>
    ${lastHtml}
    <div class="col-heads">
      <div class="col-head">#</div><div class="col-head"></div><div class="col-head">${wLabel}</div>
      <div class="col-head">Reps</div><div class="col-head"></div>
    </div>
    <div class="sets-body" id="sets-${ex.id}">${renderSetRows(ex.id,d.sets,color)}</div>
    <div class="ex-footer">
      <button class="add-set-btn" style="--sess-color:${color}" onclick="addSet('${ex.id}')">+ Set</button>
      <div class="notes-label">💬 Comments</div>

function renderSetRows(exId,sets,color){
  return sets.map((s,i)=>{
    const noteOpen=setNoteOpen[`${exId}-${i}`]||!!s.note;
    const numStyle=s.note?`background:${color};color:#fff;outline:2px solid rgba(0,0,0,.15);`:'';
    return `
    <div class="set-row">
      <div class="set-num${s.weight||s.reps?' filled':''}" data-num="${exId}-${i}" style="--sess-color:${color};${numStyle}cursor:pointer" onclick="toggleSetNote('${exId}',${i})" title="Add set note">${i+1}</div>
      <button class="set-start-btn${s.t_start?' done':''}" onclick="startSet('${exId}',${i})" title="${s.t_start?'Started: '+fmtTime(s.t_start):'Start set'}">${s.t_start?'●':'▶'}</button>
      <input type="number" step="0.5" class="set-input weight-input" style="--sess-color:${color}"
        value="${s.weight||''}" placeholder="—"
        onfocus="onSetFocus('${exId}',${i})"
        oninput="updateWeight('${exId}',${i},this.value)"
        onblur="onSetBlur('${exId}',${i})">
      <input type="number" class="set-input reps-input"
        value="${s.reps||''}" placeholder="—"
        onfocus="onSetFocus('${exId}',${i})"
        oninput="updateReps('${exId}',${i},this.value)"
        onblur="onSetBlur('${exId}',${i})">
      <button class="rm-btn" onclick="removeSet('${exId}',${i})" ${sets.length<=1?'disabled':''}>×</button>
    </div>
    ${noteOpen?`<div style="padding:2px 0 5px 31px">
      <input type="text" value="${escHtml(s.note||'')}" placeholder="Set ${i+1} note…"
        style="width:100%;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:11px;color:var(--ink2);background:#fafaf8;font-family:'DM Sans',sans-serif"
        oninput="updateSetNote('${exId}',${i},this.value)">
    </div>`:''}`;
  }).join('');
}
function toggleSetNote(exId,idx){
  const key=`${exId}-${idx}`;
  setNoteOpen[key]=!setNoteOpen[key];
  renderSetsFor(exId);
}
function updateSetNote(exId,idx,val){
  getExData(exId).sets[idx].note=val;saveDraft();
}

function renderSetsFor(exId){
  const d=getExData(exId);
  const container=document.getElementById('sets-'+exId);
  if(container)container.innerHTML=renderSetRows(exId,d.sets,SESSIONS_COLOR(exId));
}
function SESSIONS_COLOR(exId){return workoutDefs[currentSession]?.color||'#1e3a5f';}
function onDateChange(val){currentDate=val;loadFormFromLogs();renderLog();}

// ─────────────────────────────────────────────────────────────────
// RENDER HISTORY
// ─────────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────
// ACTIVITY HEATMAP (GitHub-style)
// ─────────────────────────────────────────────────────────────────
function buildHeatmapData(){
  const byDate={};
  Object.values(allLogs).forEach(log=>{
    const vol=Object.values(log.data||{}).reduce((t,ex)=>
      t+(ex?.sets||[]).reduce((s,r)=>s+((parseFloat(r.weight)||0)*(parseInt(r.reps)||0)),0),0);
    if(!byDate[log.date])byDate[log.date]={volume:0,sessions:[]};
    byDate[log.date].volume+=vol;
    byDate[log.date].sessions.push(log.session);
  });
  // Level 1-4 by volume quartile among training days
  const vols=Object.values(byDate).map(d=>d.volume).filter(v=>v>0).sort((a,b)=>a-b);
  const n=vols.length;
  const q=p=>vols[Math.max(0,Math.floor(n*p)-1)]||0;
  Object.values(byDate).forEach(d=>{
    const v=d.volume;
    d.level=n<2?1:v<=q(.25)?1:v<=q(.5)?2:v<=q(.75)?3:4;
  });
  return byDate;
}

function calcHeatmapStats(byDate){
  // Week-based streak (consecutive weeks with ≥1 workout)
  const wk=ds=>{const d=new Date(ds+'T12:00:00'),dw=d.getDay(),dm=dw===0?6:dw-1;
    d.setDate(d.getDate()-dm);return d.toISOString().split('T')[0];};
  const weeks=new Set(Object.keys(byDate).map(wk));
  const sw=[...weeks].sort();
  let lng=0,streak=0,prev=null;
  for(const w of sw){
    streak=prev&&Math.round((new Date(w)-new Date(prev))/604800000)===1?streak+1:1;
    if(streak>lng)lng=streak;
    prev=w;
  }
  let cur=0;const tw=wk(today());let chk=new Date(tw+'T12:00:00');
  while(weeks.has(chk.toISOString().split('T')[0])){cur++;chk.setDate(chk.getDate()-7);}
  const ago28=new Date();ago28.setDate(ago28.getDate()-27);
  const recent=Object.keys(byDate).filter(d=>d>=ago28.toISOString().split('T')[0]).length;
  return{cur,lng,total:Object.keys(byDate).length,recent};
}

function renderHeatmap(){
  const byDate=buildHeatmapData();
  const{cur,lng,total,recent}=calcHeatmapStats(byDate);
  const CELL=11,GAP=2,STEP=CELL+GAP,WEEKS=53;
  const COLS=['#1A1A24','#0e4429','#006d32','#26a641','#39d353'];
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Grid: start from Monday of the week WEEKS-1 weeks before the current week
  const now=new Date();
  const dow=now.getDay(),dm=dow===0?6:dow-1;
  const curMonday=new Date(now);curMonday.setDate(now.getDate()-dm);
  const start=new Date(curMonday);start.setDate(curMonday.getDate()-(WEEKS-1)*7);

  // Build columns (each = 1 week Mon→Sun)
  const weeks=[];const d=new Date(start);
  while(d<=now||(weeks.length<WEEKS&&d.getDay()!==1)){
    if(weeks.length===WEEKS)break;
    const week=[];
    for(let i=0;i<7;i++){
      const ds=d.toISOString().split('T')[0];
      const future=d>now;
      const info=byDate[ds];
      week.push({date:ds,level:future?-1:(info?info.level:0),
        volume:info?.volume||0,sessions:info?.sessions||[],future,isToday:ds===today()});
      d.setDate(d.getDate()+1);
    }
    weeks.push(week);
  }

  // Month labels (absolute positioned over the scroll container)
  let mlHtml='',lastM=-1;
  weeks.forEach((wk,wi)=>{
    const first=wk.find(c=>!c.future);if(!first)return;
    const m=new Date(first.date+'T12:00:00').getMonth();
    if(m!==lastM){mlHtml+=`<span style="position:absolute;left:${wi*STEP}px;font-size:9px;color:var(--muted);font-weight:600;white-space:nowrap">${MN[m]}</span>`;lastM=m;}
  });

  // Day labels: show M W F (Mon Wed Fri) only
  const DL=['M','','W','','F','',''];
  const dlHtml=DL.map(l=>
    `<div style="height:${CELL}px;font-size:9px;line-height:${CELL}px;color:var(--muted);width:9px;text-align:right;flex-shrink:0">${l}</div>`
  ).join(`<div style="height:${GAP}px"></div>`);

  // Grid cells
  const gridHtml=weeks.map(wk=>
    `<div style="display:flex;flex-direction:column;gap:${GAP}px">
    ${wk.map(c=>{
      if(c.future)return`<div style="width:${CELL}px;height:${CELL}px"></div>`;
      const bg=COLS[Math.max(0,c.level)];
      const outline=c.isToday?`outline:2px solid var(--ink);outline-offset:1px;`:'';
      return`<div onclick="heatmapTap('${c.date}')"
        style="width:${CELL}px;height:${CELL}px;border-radius:2px;background:${bg};${outline}flex-shrink:0;cursor:${c.sessions.length?'pointer':'default'}"></div>`;
    }).join('')}
    </div>`
  ).join('');

  const totalW=weeks.length*STEP+14;
  return`
    <div style="background:var(--white);border-radius:14px;margin:12px 16px 4px;padding:16px 16px 12px;border:1px solid var(--line)">
      <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px">Activity · Last year</div>
      <div style="display:flex;gap:0;margin-bottom:16px">
        ${[
          [cur, cur===1?'Week<br>streak':'Weeks<br>streak', cur>0?'🔥':''],
          [lng, 'Best<br>streak', ''],
          [recent, 'Last<br>4 wk.', ''],
          [total, 'Total<br>sessions', ''],
        ].map(([v,l,e])=>`<div style="flex:1;border-right:1px solid var(--line);padding:0 10px;first:padding-left:0">
          <div style="font-size:22px;font-weight:700;font-family:'DM Mono',monospace;color:var(--ink);line-height:1">${v}${e?` <span style="font-size:16px">${e}</span>`:''}</div>
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:3px;line-height:1.4">${l}</div>
        </div>`).join('')}
      </div>
      <div id="hm-scroll" style="overflow-x:auto;-webkit-overflow-scrolling:touch;cursor:grab">
        <div style="min-width:${totalW}px;padding-bottom:2px">
          <div style="position:relative;height:13px;margin-left:12px;margin-bottom:4px">${mlHtml}</div>
          <div style="display:flex;gap:3px;align-items:flex-start">
            <div style="display:flex;flex-direction:column;gap:${GAP}px;padding-top:0;flex-shrink:0">${dlHtml}</div>
            <div style="display:flex;gap:${GAP}px">${gridHtml}</div>
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:4px;margin-top:10px;font-size:10px;color:var(--muted)">
        Less ${COLS.map(c=>`<div style="width:10px;height:10px;border-radius:2px;background:${c};display:inline-block"></div>`).join('')} More
      </div>
    </div>`;
}

    </div>`;
  document.body.appendChild(pop);

function heatmapNav(date){
  const d=buildHeatmapData()[date];

function renderHistory(){
  const heatmap=renderHeatmap();
  const logs=Object.values(allLogs).sort((a,b)=>b.date.localeCompare(a.date)||a.session.localeCompare(b.session));

  if(!logs.length){
    document.getElementById('page-history').innerHTML=heatmap+
      `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No sessions logged</div><div class="empty-sub">Go to "Train" to add your first session</div></div>`;
    setTimeout(()=>{const s=document.getElementById('hm-scroll');if(s)s.scrollLeft=s.scrollWidth;},0);
    return;
  }

  let html=heatmap;
  for(const log of logs){
    const sess=workoutDefs[log.session];if(!sess)continue;
    const {color}=sess;
    const exWithData=sess.exercises.filter(ex=>log.data[ex.id]?.sets?.some(s=>s.weight||s.reps));
    const totalVol=exWithData.reduce((t,ex)=>t+calcExVolume(ex.id,log.data[ex.id]),0);
    const logKey=`${log.session}_${log.date}`;
    const isOpen=expandedLog===logKey;
    const sc=log.manualStrain!=null?(log.manualStrain>=18?'#E84040':log.manualStrain>=14?'#F5A623':log.manualStrain>=9?'#F5C842':'#3CE0A0'):'var(--muted)';
    html+=`<div class="hist-item" id="hist-${log.session}-${log.date}" style="--sess-color:${color}">
      <div class="hist-toggle-row">
        <button class="hist-toggle" onclick="toggleLog('${log.session}','${log.date}')">
          <div style="flex:1;min-width:0">
            <div class="hist-date" style="display:flex;align-items:center;gap:7px">
              <span style="font-size:10px;font-weight:800;color:#fff;background:${color};padding:2px 7px;border-radius:4px;flex-shrink:0">${log.session}</span>
              ${fmtDate(log.date)}
            </div>
            <div class="hist-sub">${sess.label} · ${exWithData.length} exercises${totalVol>0?' · '+fmtVol(totalVol):''}</div>
          </div>
          <div class="hist-arrow">${isOpen?'▲':'▼'}</div>
        </button>
        <button class="hist-strain-btn" onclick="promptStrain('${log.session}','${log.date}')">
          ${log.manualStrain!=null
            ?`<div style="font-size:13px;font-weight:700;color:${sc};font-family:'DM Mono',monospace;line-height:1.1">${log.manualStrain.toFixed(1)}</div>`
            :`<div style="font-size:18px;color:var(--line);line-height:1">＋</div>`}
          <div style="font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px">strain</div>
        </button>
      </div>
      ${isOpen?`<div class="hist-body">${renderHistBody(log,sess,color)}</div>`:''}
    </div>`;
  }

  document.getElementById('page-history').innerHTML=html;
  setTimeout(()=>{const s=document.getElementById('hm-scroll');if(s)s.scrollLeft=s.scrollWidth;},0);
}

function renderHistBody(log,sess,color){
  // ── Session timing header ─────────────────────────────────────
  let html=`<div class="hist-times">
    <div style="display:flex;align-items:center;gap:5px">
      <span class="hist-time-label">START</span>
      <input type="time" class="hist-time-input" value="${log.startTime?fmtTime24(log.startTime):''}"
        onchange="editLogTime('${log.session}','${log.date}','start',this.value)">
    </div>
    <span style="color:var(--muted);font-size:13px">→</span>
    <div style="display:flex;align-items:center;gap:5px">
      <span class="hist-time-label">END</span>
      <input type="time" class="hist-time-input" value="${log.endTime?fmtTime24(log.endTime):''}"
        onchange="editLogTime('${log.session}','${log.date}','end',this.value)">
    </div>
    <span class="sess-time-dur" id="hist-dur-${log.session}-${log.date}">${log.startTime&&log.endTime?fmtDuration(log.startTime,log.endTime):''}</span>
  </div>
  ${renderHistDailyMetrics(log.date,log.session)}
  `;
  for(const ex of sess.exercises){
    const d=log.data[ex.id];
    if(!d?.sets?.some(s=>s.weight||s.reps))continue;
    const filled=d.sets.filter(s=>s.weight||s.reps);
    const setsStr=filled.map((s,i)=>{
      const hrTxt=s.avg_hr!=null
        ?` <span style="font-family:'DM Mono',monospace;font-size:10px;color:#E84040;font-weight:600">❤ ${Math.round(s.avg_hr)}/${Math.round(s.max_hr)}</span>`:'';
      const noteTxt=s.note?` <em style="font-size:10px;color:var(--muted)">${escHtml(s.note)}</em>`:'';
      const timeTxt=(s.t_start||s.t_end)?`<br><span class="hist-set-time">⏱ ${s.t_start?fmtTime(s.t_start):'?'}${s.t_end?' → '+fmtTime(s.t_end):''}</span>`:'';
      return`S${i+1}: ${s.weight?`<b>${s.weight}${ex.unit}</b>`:'—'}${s.reps?` ×${s.reps}`:''}${hrTxt}${noteTxt}${timeTxt}`;
    }).join('  ·  ');
    const vol=calcExVolume(ex.id,d);
    // Check if this was a PR at the time
    const maxW=Math.max(...(d.sets.map(s=>parseFloat(s.weight)||0)));
    const hist=Object.values(allLogs).filter(l=>l.session===sess.label.slice(-1)&&l.date<log.date).flatMap(l=>(l.data[ex.id]?.sets||[]).map(s=>parseFloat(s.weight)||0)).reduce((mx,w)=>Math.max(mx,w),0);
    const wasPR=maxW>0&&maxW>hist;
    html+=`<div class="hist-ex">
      <div class="hist-ex-name">${ex.name}${wasPR?'<span class="pr-badge show" style="font-size:9px">🏆 PR</span>':''}</div>
      <div class="hist-sets">${setsStr}</div>
      ${d.notes?`<div class="hist-notes">${d.notes}</div>`:''}
      ${vol>0?`<div class="hist-vol">Vol: ${fmtVol(vol)}</div>`:''}
    </div>`;
  }
  // ── Ejercicios extra (ad-hoc) ─────────────────────────────────
  for(const adEx of (log.adhocExercises||[])){
    const d=log.data[adEx.id];
    if(!d?.sets?.some(s=>s.weight||s.reps))continue;
    const filled=d.sets.filter(s=>s.weight||s.reps);
    const setsStr=filled.map((s,i)=>{
      const hrTxt=s.avg_hr!=null?` <span style="font-family:'DM Mono',monospace;font-size:10px;color:#E84040;font-weight:600">❤ ${Math.round(s.avg_hr)}/${Math.round(s.max_hr)}</span>`:'';
      const noteTxt=s.note?` <em style="font-size:10px;color:var(--muted)">${escHtml(s.note)}</em>`:'';
      const timeTxt=(s.t_start||s.t_end)?`<br><span class="hist-set-time">⏱ ${s.t_start?fmtTime(s.t_start):'?'}${s.t_end?' → '+fmtTime(s.t_end):''}</span>`:'';
      return`S${i+1}: ${s.weight?`<b>${s.weight}${adEx.unit}</b>`:'—'}${s.reps?` ×${s.reps}`:''}${hrTxt}${noteTxt}${timeTxt}`;
    }).join('  ·  ');
    const vol=filled.reduce((t,s)=>t+((parseFloat(s.weight)||0)*(parseInt(s.reps)||0)),0);
    html+=`<div class="hist-ex">
      <div class="hist-ex-name">${escHtml(adEx.name)} <span class="adhoc-badge">EXTRA</span></div>
      <div class="hist-sets">${setsStr}</div>
      ${d.notes?`<div class="hist-notes">${escHtml(d.notes)}</div>`:''}
      ${vol>0?`<div class="hist-vol">Vol: ${fmtVol(vol)}</div>`:''}
    </div>`;
  }
  html+=`<button class="hist-del-btn" onclick="deleteLog('${log.session}','${log.date}')">🗑 Delete session</button>`;
  return html;
}

function toggleLog(session,date){
  const key=`${session}_${date}`;
  expandedLog=expandedLog===key?null:key;
  renderHistory();
}
function deleteLog(session,date){
  if(!confirm(`Delete session ${session} from ${fmtDate(date)}?`))return;
  const key=`${session}_${date}`;
  delete allLogs[key];saveAll();deleteFromCloud(key);updateStats();expandedLog=null;renderHistory();
}

function deleteSessionTemplate(key){
  if(!confirm(`Archive template "${workoutDefs[key]?.label}"?\n\nHistory is preserved and you can restore it any time from Sessions.`))return;
  workoutDefs[key]._archived=true;
  saveWorkoutDefs();
  setView('sesiones',null);
  renderSesiones();
  showToast('Template archived. Restore it in Sessions.');
}
function restoreSessionTemplate(key){
  if(!workoutDefs[key])return;
  workoutDefs[key]._archived=false;
  saveWorkoutDefs();
  renderSesiones();
  showToast('Template restored.');
}
function moveExercise(exId,delta){
  const sess=workoutDefs[currentSession];
  const exs=sess.exercises;
  const idx=exs.findIndex(e=>e.id===exId);
  if(idx<0)return;
  const ni=idx+delta;
  if(ni<0||ni>=exs.length)return;
  [exs[idx],exs[ni]]=[exs[ni],exs[idx]];
  saveWorkoutDefs();
  renderLog();
}
let _focusInterval=null;
function showFocusModal(exId,idx){
  const ex=(workoutDefs[currentSession]?.exercises||[]).find(e=>e.id===exId)||adhocExercises.find(e=>e.id===exId);
  const s=formData[exId]?.sets[idx];if(!s)return;
  clearInterval(_focusInterval);
  document.getElementById('focus-ex-name').textContent=ex?.name||'Exercise';
  const wt=s.weight?`${s.weight}${ex?.unit||'kg'}`:'—';
  const rp=s.reps?` × ${s.reps} reps`:'';
  document.getElementById('focus-set-label').textContent=`Set ${idx+1}  ${wt}${rp}`;
  const t0=s.t_start?new Date(s.t_start).getTime():Date.now();
  function tick(){
    const sec=Math.floor((Date.now()-t0)/1000);
    const m=Math.floor(sec/60),ss=sec%60;
    const el=document.getElementById('focus-timer');
    if(el)el.textContent=`${m}:${String(ss).padStart(2,'0')}`;
  }
  tick();_focusInterval=setInterval(tick,1000);
  const fm=document.getElementById('focus-modal');if(fm)fm.style.display='flex';
}
function closeFocusModal(){
  clearInterval(_focusInterval);
  const fm=document.getElementById('focus-modal');if(fm)fm.style.display='none';
}
function startSet(exId,idx){
  const d=getExData(exId);
  if(!d.sets[idx])return;
  d.sets[idx].t_start=new Date().toISOString();
  if(!sessionStartTime)sessionStartTime=d.sets[idx].t_start;
  saveDraft();
  renderSetsFor(exId);
  showFocusModal(exId,idx);
}
function setWorkoutStart(){
  sessionStartTime=new Date().toISOString();
  saveDraft();renderLog();
  showToast('Start: '+fmtTime(sessionStartTime));
}
function setWorkoutEnd(){
  sessionEndTime=new Date().toISOString();
  saveDraft();renderLog();
  showToast('End: '+fmtTime(sessionEndTime));
}
function editWorkoutTime(which,timeVal){
  if(!timeVal)return;
  const[h,m]=timeVal.split(':').map(Number);
  const d=new Date(currentDate+'T12:00:00');
  d.setHours(h,m,0,0);
  if(which==='start')sessionStartTime=d.toISOString();
  else sessionEndTime=d.toISOString();
  saveDraft();
  // update duration label without full re-render
  const el=document.querySelector('.sess-time-dur');
  if(el&&sessionStartTime&&sessionEndTime)el.textContent=fmtDuration(sessionStartTime,sessionEndTime);
}
function editLogTime(session,date,which,timeVal){
  if(!timeVal)return;
  const key=`${session}_${date}`;
  if(!allLogs[key])return;
  const[h,m]=timeVal.split(':').map(Number);
  const d=new Date(date+'T12:00:00');
  d.setHours(h,m,0,0);
  if(which==='start')allLogs[key].startTime=d.toISOString();
  else allLogs[key].endTime=d.toISOString();
  saveAll();saveToCloud(key);
  showToast('Time updated');
  // update duration inline without full re-render
  const dur=document.getElementById(`hist-dur-${session}-${date}`);
  if(dur&&allLogs[key].startTime&&allLogs[key].endTime)
    dur.textContent=fmtDuration(allLogs[key].startTime,allLogs[key].endTime);
}
function editLogStrain(session,date,val){
  const key=`${session}_${date}`;
  if(!allLogs[key])return;
  const v=parseFloat(val);
  allLogs[key].manualStrain=(isNaN(v)||val==='')?null:Math.min(21,Math.max(0,v));
  saveAll();saveToCloud(key);
}
function promptStrain(session,date){
  document.getElementById('heatmap-popup')?.remove();
  const key=`${session}_${date}`;
  if(!allLogs[key])return;
  const cur=allLogs[key].manualStrain;
  const val=prompt(`Strain for ${session} on ${fmtDate(date)} (0–21):`,cur!=null?String(cur):'');
  if(val===null)return;
  editLogStrain(session,date,val);
  renderHistory();
  if(currentView==='home')renderHome();
}
async function updateAdHocSearch(val){
  adhocSearchQuery=val;
  const container=document.getElementById('adhoc-search-results');
  if(!container)return;
  if(!val||val.length<2){container.innerHTML='';return;}
  const q=val.toLowerCase();
  const results=[];const seen=new Set();
  for(const sess of Object.values(workoutDefs)){
    if(sess._deleted||sess._archived)continue;
    for(const ex of (sess.exercises||[])){
      if(ex.name.toLowerCase().includes(q)&&!seen.has(ex.name)){
        seen.add(ex.name);results.push({name:ex.name,unit:ex.unit||'kg',source:'session'});
      }
    }
  }
  await ensureFreeExDb();
  for(const ex of (_freeExAll||[])){
    if(results.length>=10)break;
    if(ex.name.toLowerCase().includes(q)&&!seen.has(ex.name)){
      seen.add(ex.name);results.push({name:ex.name,unit:'kg',source:'library'});
    }
  }
  if(!document.getElementById('adhoc-search-results'))return;
  if(!results.length){
    container.innerHTML=`<div style="padding:10px 12px;font-size:12px;color:var(--muted)">No results</div>`;
    return;
  }
  const sliced=results.slice(0,8);
  container.innerHTML=sliced.map((r,i)=>
    `<button type="button" class="adhoc-search-result" data-idx="${i}">
      <b>${escHtml(r.name)}</b>
      <span style="font-size:10px;color:var(--muted)">${r.unit||'kg'}${r.source==='session'?' · session':''}</span>
    </button>`
  ).join('');
  // pointerdown fires before blur — avoids the click-after-blur race on all browsers
  container.onpointerdown=function(e){
    const btn=e.target.closest('[data-idx]');
    if(!btn)return;
    e.preventDefault();
    const r=sliced[+btn.dataset.idx];
    if(r)selectAdHocFromSearch(r.name,r.unit||'kg');
  };
}
function selectAdHocFromSearch(name,unit){
  const inp=document.getElementById('adhoc-name-input');
  if(inp)inp.value=name;
  const sel=document.getElementById('adhoc-unit-select');
  if(sel)sel.value=unit;
  const cont=document.getElementById('adhoc-search-results');
  if(cont)cont.innerHTML='';
  adhocSearchQuery=name;
}

function getChartData(exId, sessKey){
  const sk=sessKey||currentSession;
  return Object.values(allLogs)
    .filter(l=>l.session===sk&&l.data[exId]?.sets?.some(s=>s.weight))
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(l=>{
      const sets=l.data[exId].sets||[];
      const weights=sets.map(s=>parseFloat(s.weight)||0).filter(w=>w>0);
      const reps=sets.map(s=>parseInt(s.reps)||0).filter(r=>r>0);
      const ex=workoutDefs[sk]?.exercises.find(e=>e.id===exId);
      return{date:l.date,weight:weights.length?Math.max(...weights):0,
        reps:reps.length?Math.round(reps.reduce((a,b)=>a+b,0)/reps.length):0,unit:ex?.unit||'kg'};
    });
}

  const pct=firstW>0?(((lastW-firstW)/firstW)*100).toFixed(1):0;

  </div>
